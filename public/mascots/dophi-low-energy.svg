<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <radialGradient id="dle-skinGrad" cx="50%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#f5c9a0"/>
      <stop offset="60%" stop-color="#e8aa78"/>
      <stop offset="100%" stop-color="#d4925c"/>
    </radialGradient>
    <radialGradient id="dle-hairGrad" cx="40%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#f4a07a"/>
      <stop offset="55%" stop-color="#e8805a"/>
      <stop offset="100%" stop-color="#c05840"/>
    </radialGradient>
    <linearGradient id="dle-hairShine" x1="25%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#ffd4b8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#f4a07a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="dle-ponytailGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f4a07a"/>
      <stop offset="55%" stop-color="#e8805a"/>
      <stop offset="100%" stop-color="#c05840"/>
    </linearGradient>
    <linearGradient id="dle-ribbonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe280"/>
      <stop offset="50%" stop-color="#ffd966"/>
      <stop offset="100%" stop-color="#e8a820"/>
    </linearGradient>
    <radialGradient id="dle-eyeIris" cx="35%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#f0a060"/>
      <stop offset="50%" stop-color="#d46030"/>
      <stop offset="100%" stop-color="#8b3010"/>
    </radialGradient>
    <linearGradient id="dle-jacketGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f09070"/>
      <stop offset="100%" stop-color="#d86848"/>
    </linearGradient>
    <linearGradient id="dle-shortsGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e87050"/>
      <stop offset="100%" stop-color="#c04828"/>
    </linearGradient>
    <linearGradient id="dle-legGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e8a878"/>
      <stop offset="100%" stop-color="#c88858"/>
    </linearGradient>
    <!-- Soft motion trail -->
    <linearGradient id="dle-trailGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f4a07a" stop-opacity="0"/>
      <stop offset="60%" stop-color="#f4a07a" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f4a07a" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="dle-ambientGlow" cx="50%" cy="58%" r="50%">
      <stop offset="0%" stop-color="#f08060" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#f08060" stop-opacity="0"/>
    </radialGradient>
    <filter id="dle-softBlur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="dle-trailBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- Ambient glow -->
  <g id="glow">
    <ellipse cx="250" cy="330" rx="145" ry="95" fill="url(#dle-ambientGlow)" filter="url(#dle-softBlur)"/>
    <ellipse cx="250" cy="172" rx="100" ry="88" fill="#f08060" fill-opacity="0.06" filter="url(#dle-softBlur)"/>
    <!-- Ground shadow -->
    <ellipse cx="250" cy="490" rx="105" ry="16" fill="#d4925c" fill-opacity="0.16"/>
  </g>

  <!-- Hair back + ponytail swinging gently -->
  <g id="hair-back">
    <!-- Back hair mass -->
    <ellipse cx="248" cy="168" rx="98" ry="106" fill="url(#dle-hairGrad)"/>
    <!-- Ponytail gently swinging back-right in gentle walking motion -->
    <path d="M 300 122 Q 346 112 388 118 Q 420 124 432 144 Q 440 162 428 182 Q 414 200 390 206 Q 364 212 342 202 Q 318 190 308 166 Q 298 142 300 122 Z" fill="url(#dle-ponytailGrad)" stroke="#c05840" stroke-width="0.8"/>
    <!-- Ponytail tip extension -->
    <path d="M 388 202 Q 408 218 406 240 Q 402 258 388 260 Q 372 260 365 244 Q 360 228 370 214 Z" fill="url(#dle-ponytailGrad)"/>
    <!-- Hair strands -->
    <path d="M 316 128 Q 364 118 412 130" stroke="#c05840" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.5"/>
    <path d="M 314 144 Q 360 134 404 144" stroke="#f4a07a" stroke-width="1.8" fill="none" stroke-linecap="round" opacity="0.45"/>
    <path d="M 316 162 Q 356 154 392 162" stroke="#c05840" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.4"/>
    <path d="M 322 186 Q 354 182 382 190" stroke="#f4a07a" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.4"/>
    <path d="M 372 212 Q 388 226 390 244" stroke="#c05840" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.38"/>
    <!-- Ponytail end curl -->
    <path d="M 378 256 Q 390 268 384 278 Q 375 283 367 274 Q 362 264 370 256 Z" fill="url(#dle-ponytailGrad)" stroke="#c05840" stroke-width="1"/>
  </g>

  <!-- Soft motion trail (behind character, gentle) -->
  <g opacity="0.55" filter="url(#dle-trailBlur)">
    <!-- Soft whoosh trails -->
    <path d="M 130 240 Q 160 235 185 242" stroke="#f4a07a" stroke-width="12" fill="none" stroke-linecap="round" opacity="0.25"/>
    <path d="M 118 280 Q 155 274 182 280" stroke="#ffd966" stroke-width="8" fill="none" stroke-linecap="round" opacity="0.22"/>
    <path d="M 125 330 Q 158 326 180 332" stroke="#f4a07a" stroke-width="10" fill="none" stroke-linecap="round" opacity="0.2"/>
    <path d="M 135 375 Q 162 372 182 377" stroke="#ffd966" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.18"/>
  </g>

  <!-- Body (gentle walking pose — slight lean, arms relaxed swing) -->
  <g id="body">
    <!-- Neck (slight angle) -->
    <rect x="236" y="264" width="30" height="28" rx="9" fill="url(#dle-skinGrad)" stroke="#c07850" stroke-width="0.5" transform="rotate(-3,251,278)"/>
    <!-- Torso (slight forward lean) -->
    <path d="M 188 290 Q 213 274 252 272 Q 296 274 320 290 L 326 400 Q 298 424 256 426 Q 214 424 182 400 Z" fill="url(#dle-jacketGrad)" stroke="#c06040" stroke-width="1" transform="translate(-6,0)"/>
    <!-- Left arm swinging forward -->
    <path d="M 182 296 Q 156 312 140 344 Q 132 368 138 390 Q 148 395 160 386 Q 162 364 170 342 Q 180 318 188 300 Z" fill="url(#dle-jacketGrad)" stroke="#c06040" stroke-width="0.8" transform="translate(-6,0)"/>
    <!-- Right arm swinging back slightly -->
    <path d="M 314 296 Q 336 310 348 340 Q 355 360 350 380 Q 340 386 332 378 Q 330 356 322 334 Q 312 312 308 298 Z" fill="url(#dle-jacketGrad)" stroke="#c06040" stroke-width="0.8" transform="translate(-6,0)"/>
    <!-- Hands -->
    <ellipse cx="148" cy="392" rx="17" ry="14" fill="url(#dle-skinGrad)" stroke="#c07850" stroke-width="0.8" transform="translate(-6,0)"/>
    <ellipse cx="344" cy="382" rx="17" ry="14" fill="url(#dle-skinGrad)" stroke="#c07850" stroke-width="0.8" transform="translate(-6,0)"/>

    <!-- Walking legs (one forward, one back) -->
    <!-- Front leg (left, stepping forward) -->
    <path d="M 200 402 Q 195 438 185 464 Q 178 480 184 488 L 212 488 Q 218 472 226 452 Q 234 432 236 408 Z" fill="url(#dle-legGrad)" stroke="#c07850" stroke-width="0.8" transform="translate(-6,0)"/>
    <!-- Back leg (right, stepping back — bent) -->
    <path d="M 272 402 Q 280 436 290 460 Q 298 476 293 486 L 318 486 Q 320 474 316 458 Q 308 434 304 408 Z" fill="url(#dle-legGrad)" stroke="#c07850" stroke-width="0.8" transform="translate(-6,0)"/>
    <!-- Front foot -->
    <ellipse cx="197" cy="490" rx="28" ry="13" fill="#d86848" stroke="#a04030" stroke-width="1" transform="translate(-6,0)"/>
    <!-- Back foot (slightly raised, mid-stride) -->
    <ellipse cx="305" cy="482" rx="25" ry="12" fill="#d86848" stroke="#a04030" stroke-width="1" transform="translate(-6,0)"/>
    <ellipse cx="183" cy="488" rx="9" ry="5" fill="#ffd966" fill-opacity="0.7" transform="translate(-6,0)"/>
  </g>

  <!-- Outfit details -->
  <g id="outfit">
    <path d="M 186 298 Q 165 348 160 400 L 172 402 Q 178 352 200 300 Z" fill="#ffd966" fill-opacity="0.7" transform="translate(-6,0)"/>
    <path d="M 316 298 Q 335 348 338 400 L 326 402 Q 321 352 308 300 Z" fill="#ffd966" fill-opacity="0.7" transform="translate(-6,0)"/>
    <path d="M 193 388 Q 218 406 252 408 Q 286 406 312 388 L 310 412 Q 287 426 252 428 Q 218 426 195 412 Z" fill="url(#dle-shortsGrad)" stroke="#a03828" stroke-width="0.8" transform="translate(-6,0)"/>
    <path d="M 218 280 Q 252 274 288 280 L 290 292 Q 252 285 216 292 Z" fill="#e06040" stroke="#c04828" stroke-width="0.8" transform="translate(-6,0)"/>
    <!-- Wing feather motif on chest -->
    <path d="M 200 316 Q 212 304 224 310 Q 216 320 212 328 Q 204 324 200 316 Z" fill="#ffd966" fill-opacity="0.85" stroke="#e8a820" stroke-width="0.8" transform="translate(-6,0)"/>
    <path d="M 197 328 Q 210 316 222 323 Q 214 334 210 340 Q 203 336 197 328 Z" fill="#ffd966" fill-opacity="0.68" stroke="#e8a820" stroke-width="0.8" transform="translate(-6,0)"/>
  </g>

  <!-- Face (gentle supportive expression) -->
  <g id="face">
    <ellipse cx="248" cy="168" rx="90" ry="94" fill="url(#dle-skinGrad)" stroke="#c07850" stroke-width="0.8" transform="rotate(-4,248,168)"/>
    <!-- Ears -->
    <ellipse cx="160" cy="178" rx="13" ry="17" fill="url(#dle-skinGrad)" stroke="#c07850" stroke-width="0.8"/>
    <ellipse cx="338" cy="178" rx="13" ry="17" fill="url(#dle-skinGrad)" stroke="#c07850" stroke-width="0.8"/>
    <ellipse cx="160" cy="178" rx="7" ry="10" fill="#e8906a" fill-opacity="0.43"/>
    <ellipse cx="338" cy="178" rx="7" ry="10" fill="#e8906a" fill-opacity="0.43"/>

    <!-- Eyebrows (soft, gently encouraging) -->
    <path d="M 200 126 Q 215 118 232 122" stroke="#a04828" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M 268 122 Q 285 118 300 126" stroke="#a04828" stroke-width="3" stroke-linecap="round" fill="none"/>

    <!-- Eyes -->
    <ellipse cx="214" cy="158" rx="27" ry="25" fill="white"/>
    <ellipse cx="284" cy="158" rx="27" ry="25" fill="white"/>
    <ellipse cx="214" cy="160" rx="20" ry="20" fill="url(#dle-eyeIris)"/>
    <ellipse cx="284" cy="160" rx="20" ry="20" fill="url(#dle-eyeIris)"/>
    <ellipse cx="215" cy="162" rx="11" ry="13" fill="#2a1008"/>
    <ellipse cx="285" cy="162" rx="11" ry="13" fill="#2a1008"/>
    <!-- Eye shines -->
    <ellipse cx="206" cy="152" rx="7" ry="6" fill="white" fill-opacity="0.93"/>
    <ellipse cx="276" cy="152" rx="7" ry="6" fill="white" fill-opacity="0.93"/>
    <circle cx="222" cy="167" r="3" fill="white" fill-opacity="0.5"/>
    <circle cx="292" cy="167" r="3" fill="white" fill-opacity="0.5"/>
    <!-- Eyelid -->
    <path d="M 189 146 Q 214 133 239 146" stroke="#7a2a10" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M 259 146 Q 284 133 309 146" stroke="#7a2a10" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M 193 171 Q 214 180 235 171" stroke="#c07050" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <path d="M 263 171 Q 284 180 305 171" stroke="#c07050" stroke-width="1.5" fill="none" stroke-linecap="round"/>

    <!-- Nose -->
    <ellipse cx="248" cy="186" rx="5" ry="3.5" fill="#c07850" fill-opacity="0.5"/>

    <!-- Gentle encouraging smile -->
    <path d="M 229 206 Q 248 219 267 206" stroke="#a05030" stroke-width="2.8" fill="none" stroke-linecap="round"/>
    <path d="M 234 208 Q 248 217 262 208 Q 248 218 234 208 Z" fill="white" fill-opacity="0.6"/>

    <!-- Blush -->
    <ellipse cx="186" cy="182" rx="23" ry="12" fill="#f08060" fill-opacity="0.28"/>
    <ellipse cx="312" cy="182" rx="23" ry="12" fill="#f08060" fill-opacity="0.28"/>
  </g>

  <!-- Hair front / bangs -->
  <g id="hair-front">
    <path d="M 160 148 Q 170 96 213 86 Q 233 82 248 82 Q 268 82 290 86 Q 332 96 340 148" fill="url(#dle-hairGrad)" stroke="#c05840" stroke-width="0.5"/>
    <path d="M 232 84 Q 244 105 248 129 Q 254 105 266 84 Q 257 80 248 80 Q 240 80 232 84 Z" fill="#c05840"/>
    <path d="M 177 120 Q 190 104 210 112 Q 220 119 220 138 Q 209 132 195 134 Q 183 130 177 120 Z" fill="#b04838"/>
    <path d="M 321 120 Q 308 104 290 112 Q 280 119 281 138 Q 292 132 305 134 Q 317 130 321 120 Z" fill="#b04838"/>
    <ellipse cx="232" cy="106" rx="28" ry="14" fill="url(#dle-hairShine)" transform="rotate(-10,232,106)"/>
    <!-- Ribbon -->
    <ellipse cx="312" cy="132" rx="14" ry="9" fill="url(#dle-ribbonGrad)" stroke="#c89020" stroke-width="1.5"/>
    <path d="M 299 128 Q 289 119 293 132 Q 297 145 308 138 Z" fill="url(#dle-ribbonGrad)" stroke="#c89020" stroke-width="1"/>
    <path d="M 325 128 Q 335 119 331 132 Q 327 145 316 138 Z" fill="url(#dle-ribbonGrad)" stroke="#c89020" stroke-width="1"/>
    <ellipse cx="312" cy="132" rx="5" ry="5" fill="#ffe280" stroke="#c89020" stroke-width="1"/>
  </g>

  <!-- Motif + chest emblem -->
  <g id="motif">
    <path d="M 242 336 Q 232 322 236 313 Q 246 308 250 317 Q 254 308 264 313 Q 268 322 258 336 Q 250 328 242 336 Z" fill="#ffd966" fill-opacity="0.78" stroke="#e8a820" stroke-width="1.2" transform="translate(-6,0)"/>
    <line x1="244" y1="314" x2="239" y2="334" stroke="#e8a820" stroke-width="1.2" stroke-linecap="round" transform="translate(-6,0)"/>
    <line x1="244" y1="314" x2="249" y2="334" stroke="#e8a820" stroke-width="1.2" stroke-linecap="round" transform="translate(-6,0)"/>
  </g>

  <!-- Particles (soft, sparse trail dots) -->
  <g id="particles">
    <circle cx="126" cy="248" r="3" fill="#ffd966" opacity="0.55"/>
    <circle cx="112" cy="290" r="2.5" fill="#f4a07a" opacity="0.48"/>
    <circle cx="118" cy="336" r="3" fill="#ffd966" opacity="0.45"/>
    <circle cx="122" cy="378" r="2" fill="#f4a07a" opacity="0.4"/>
    <circle cx="370" cy="220" r="2.5" fill="#ffd966" opacity="0.45"/>
    <circle cx="380" cy="262" r="2" fill="#f4a07a" opacity="0.4"/>
    <!-- Tiny sparkle near trail -->
    <path d="M 110 260 L 112 255 L 114 260 L 119 258 L 114 262 L 119 266 L 114 264 L 112 269 L 110 264 L 105 266 L 110 262 L 105 258 Z" fill="#ffd966" opacity="0.48"/>
  </g>
</svg>

    <radialGradient id="twc-hair" cx="50%" cy="30%" r="60%"><stop offset="0%" stop-color="#5058a0"/><stop offset="60%" stop-color="#3a4080"/><stop offset="100%" stop-color="#282860"/></radialGradient>
    <linearGradient id="twc-outfit" x1="0%" y1="0%" x2="10%" y2="100%"><stop offset="0%" stop-color="#3a4488"/><stop offset="100%" stop-color="#282060"/></linearGradient>
    <linearGradient id="twc-cap" x1="0%" y1="0%" x2="20%" y2="100%"><stop offset="0%" stop-color="#4858a8"/><stop offset="100%" stop-color="#303878"/></linearGradient>

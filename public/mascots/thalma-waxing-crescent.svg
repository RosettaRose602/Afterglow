    <radialGradient id="twc-moonGlow" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#f8e8a0" stop-opacity="0.6"/><stop offset="100%" stop-color="#f8e8a0" stop-opacity="0"/></radialGradient>

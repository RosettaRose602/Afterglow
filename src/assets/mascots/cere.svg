<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Skin gradient -->
    <radialGradient id="skinGrad" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#fde8d0"/>
      <stop offset="100%" stop-color="#f5c9a0"/>
    </radialGradient>
    <!-- Hair gradient -->
    <radialGradient id="hairGrad" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#f0d080"/>
      <stop offset="60%" stop-color="#d4a030"/>
      <stop offset="100%" stop-color="#b88020"/>
    </radialGradient>
    <linearGradient id="hairShine" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#fff8d0" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#f0d080" stop-opacity="0"/>
    </linearGradient>
    <!-- Outfit gradient -->
    <linearGradient id="outfitGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fffef5"/>
      <stop offset="100%" stop-color="#e8e0c8"/>
    </linearGradient>
    <linearGradient id="goldTrimGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e8c040"/>
      <stop offset="50%" stop-color="#f8e060"/>
      <stop offset="100%" stop-color="#e8c040"/>
    </linearGradient>
    <!-- Eye gradient -->
    <radialGradient id="eyeIrisL" cx="45%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#d08820"/>
      <stop offset="60%" stop-color="#a06010"/>
      <stop offset="100%" stop-color="#703800"/>
    </radialGradient>
    <radialGradient id="eyeIrisR" cx="45%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#d08820"/>
      <stop offset="60%" stop-color="#a06010"/>
      <stop offset="100%" stop-color="#703800"/>
    </radialGradient>
    <!-- Crown / brain glow -->
    <radialGradient id="crownGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe060" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#f0a020" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#e08000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="haloGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe060" stop-opacity="0.0"/>
      <stop offset="70%" stop-color="#f0c030" stop-opacity="0.4"/>
      <stop offset="85%" stop-color="#f8d040" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#e8b020" stop-opacity="0.2"/>
    </radialGradient>
    <!-- Body glow -->
    <radialGradient id="bodyGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f8d860" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f8d860" stop-opacity="0"/>
    </radialGradient>
    <!-- Blur filter for glow -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bigGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Ambient body glow -->
  <g id="glow">
    <ellipse cx="256" cy="320" rx="140" ry="100" fill="url(#bodyGlow)" filter="url(#bigGlow)"/>
    <ellipse cx="256" cy="130" rx="110" ry="90" fill="#f8d860" fill-opacity="0.12" filter="url(#bigGlow)"/>
  </g>

  <!-- Hair back -->
  <g id="hair-back">
    <ellipse cx="256" cy="168" rx="98" ry="105" fill="url(#hairGrad)"/>
    <!-- Back hair flow -->
    <path d="M 172 200 Q 150 280 158 370 Q 162 390 175 390 Q 185 390 188 370 Q 192 300 200 240 Z" fill="#c89828"/>
    <path d="M 340 200 Q 362 280 354 370 Q 350 390 337 390 Q 327 390 324 370 Q 320 300 312 240 Z" fill="#c89828"/>
  </g>

  <!-- Body -->
  <g id="body">
    <!-- Neck -->
    <rect x="238" y="258" width="36" height="28" rx="8" fill="url(#skinGrad)"/>
    <!-- Body / dress base -->
    <path d="M 175 285 Q 195 268 256 265 Q 317 268 337 285 L 348 420 Q 300 445 256 448 Q 212 445 164 420 Z" fill="url(#outfitGrad)"/>
    <!-- Arm left -->
    <ellipse cx="170" cy="330" rx="22" ry="55" fill="url(#outfitGrad)" transform="rotate(-8,170,330)"/>
    <!-- Arm right -->
    <ellipse cx="342" cy="330" rx="22" ry="55" fill="url(#outfitGrad)" transform="rotate(8,342,330)"/>
    <!-- Hands -->
    <ellipse cx="162" cy="382" rx="18" ry="15" fill="url(#skinGrad)"/>
    <ellipse cx="350" cy="382" rx="18" ry="15" fill="url(#skinGrad)"/>
  </g>

  <!-- Outfit detail -->
  <g id="outfit">
    <!-- Gold trim on collar -->
    <path d="M 218 278 Q 256 270 294 278 L 296 290 Q 256 282 216 290 Z" fill="url(#goldTrimGrad)"/>
    <!-- Gold trim on skirt hem -->
    <path d="M 168 418 Q 256 442 344 418 L 348 428 Q 256 455 164 428 Z" fill="url(#goldTrimGrad)"/>
    <!-- Center emblem -->
    <circle cx="256" cy="340" r="12" fill="none" stroke="#e8c040" stroke-width="2"/>
    <path d="M 256 332 L 259 338 L 266 338 L 260 343 L 263 350 L 256 345 L 249 350 L 252 343 L 246 338 L 253 338 Z" fill="#f0d050"/>
    <!-- Sleeve cuffs -->
    <ellipse cx="170" cy="363" rx="24" ry="9" fill="none" stroke="#e8c040" stroke-width="2.5"/>
    <ellipse cx="342" cy="363" rx="24" ry="9" fill="none" stroke="#e8c040" stroke-width="2.5"/>
  </g>

  <!-- Face -->
  <g id="face">
    <!-- Head -->
    <ellipse cx="256" cy="168" rx="90" ry="95" fill="url(#skinGrad)"/>
    <!-- Ears -->
    <ellipse cx="168" cy="178" rx="14" ry="18" fill="url(#skinGrad)"/>
    <ellipse cx="344" cy="178" rx="14" ry="18" fill="url(#skinGrad)"/>
    <ellipse cx="168" cy="178" rx="8" ry="11" fill="#f5b8a0"/>
    <ellipse cx="344" cy="178" rx="8" ry="11" fill="#f5b8a0"/>

    <!-- Eyebrows -->
    <path d="M 208 130 Q 220 124 234 128" stroke="#a07020" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M 278 128 Q 292 124 304 130" stroke="#a07020" stroke-width="3" stroke-linecap="round" fill="none"/>

    <!-- Eye whites left -->
    <ellipse cx="222" cy="158" rx="28" ry="26" fill="white"/>
    <!-- Eye whites right -->
    <ellipse cx="290" cy="158" rx="28" ry="26" fill="white"/>

    <!-- Iris left -->
    <ellipse cx="222" cy="160" rx="21" ry="22" fill="url(#eyeIrisL)"/>
    <!-- Iris right -->
    <ellipse cx="290" cy="160" rx="21" ry="22" fill="url(#eyeIrisR)"/>

    <!-- Pupils -->
    <ellipse cx="223" cy="162" rx="11" ry="13" fill="#3a1a00"/>
    <ellipse cx="291" cy="162" rx="11" ry="13" fill="#3a1a00"/>

    <!-- Eye highlights -->
    <ellipse cx="215" cy="152" rx="7" ry="6" fill="white" fill-opacity="0.9"/>
    <ellipse cx="283" cy="152" rx="7" ry="6" fill="white" fill-opacity="0.9"/>
    <ellipse cx="228" cy="168" rx="3" ry="3" fill="white" fill-opacity="0.5"/>
    <ellipse cx="296" cy="168" rx="3" ry="3" fill="white" fill-opacity="0.5"/>

    <!-- Upper eyelid lines -->
    <path d="M 194 148 Q 222 136 250 148" stroke="#5a3010" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M 262 148 Q 290 136 318 148" stroke="#5a3010" stroke-width="2.5" fill="none" stroke-linecap="round"/>

    <!-- Lower eyelashes -->
    <path d="M 198 172 Q 222 180 246 172" stroke="#8a5020" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <path d="M 266 172 Q 290 180 314 172" stroke="#8a5020" stroke-width="1.5" fill="none" stroke-linecap="round"/>

    <!-- Nose -->
    <ellipse cx="256" cy="185" rx="5" ry="3.5" fill="#e0a888" fill-opacity="0.6"/>

    <!-- Mouth - warm smile -->
    <path d="M 238 202 Q 256 216 274 202" stroke="#d08070" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M 244 208 Q 256 218 268 208" fill="#f5c0b0" stroke="none"/>

    <!-- Blush -->
    <ellipse cx="200" cy="185" rx="22" ry="13" fill="#f0a0b0" fill-opacity="0.35"/>
    <ellipse cx="312" cy="185" rx="22" ry="13" fill="#f0a0b0" fill-opacity="0.35"/>
  </g>

  <!-- Hair front -->
  <g id="hair-front">
    <!-- Main fringe -->
    <path d="M 168 145 Q 175 100 210 95 Q 230 90 256 90 Q 282 90 302 95 Q 337 100 344 145" fill="url(#hairGrad)" stroke="none"/>
    <!-- Center bang -->
    <path d="M 235 92 Q 245 105 250 125 Q 254 135 256 130 Q 258 135 262 125 Q 267 105 277 92 Q 266 88 256 88 Q 246 88 235 92 Z" fill="#d4a030"/>
    <!-- Left bang -->
    <path d="M 186 118 Q 195 108 210 115 Q 220 120 220 135 Q 210 130 200 132 Q 190 128 186 118 Z" fill="#c89828"/>
    <!-- Right bang -->
    <path d="M 326 118 Q 317 108 302 115 Q 292 120 292 135 Q 302 130 312 132 Q 322 128 326 118 Z" fill="#c89828"/>
    <!-- Hair shine -->
    <ellipse cx="240" cy="115" rx="28" ry="16" fill="url(#hairShine)" transform="rotate(-15,240,115)"/>
  </g>

  <!-- Brain crown / motif -->
  <g id="motif" filter="url(#softGlow)">
    <!-- Crown base -->
    <ellipse cx="256" cy="82" rx="55" ry="22" fill="#f0c040" fill-opacity="0.9"/>
    <!-- Crown spikes -->
    <path d="M 210 82 L 205 55 L 220 65 L 228 45 L 238 68 L 256 48 L 274 68 L 284 45 L 292 65 L 307 55 L 302 82 Z" fill="url(#goldTrimGrad)" stroke="#d4a020" stroke-width="1.5"/>

    <!-- Brain lobes (stylized on top) -->
    <g filter="url(#glow)">
      <ellipse cx="237" cy="62" rx="20" ry="14" fill="#f8d060" stroke="#e0a020" stroke-width="1.5"/>
      <ellipse cx="275" cy="62" rx="20" ry="14" fill="#f8d060" stroke="#e0a020" stroke-width="1.5"/>
      <!-- Brain grooves -->
      <path d="M 230 56 Q 237 50 244 56 Q 238 62 230 58" stroke="#d09020" stroke-width="1.2" fill="none"/>
      <path d="M 268 56 Q 275 50 282 56 Q 276 62 268 58" stroke="#d09020" stroke-width="1.2" fill="none"/>
      <path d="M 225 64 Q 237 70 249 64" stroke="#d09020" stroke-width="1.2" fill="none"/>
      <path d="M 263 64 Q 275 70 287 64" stroke="#d09020" stroke-width="1.2" fill="none"/>
      <!-- Center divide -->
      <line x1="256" y1="50" x2="256" y2="76" stroke="#c88010" stroke-width="1.5"/>
    </g>

    <!-- Crown glow halo -->
    <ellipse cx="256" cy="82" rx="70" ry="30" fill="url(#crownGlow)" filter="url(#bigGlow)"/>

    <!-- Halo ring -->
    <ellipse cx="256" cy="70" rx="62" ry="12" fill="none" stroke="url(#goldTrimGrad)" stroke-width="3" stroke-opacity="0.7"/>

    <!-- Neural spark lines -->
    <g stroke="#ffe060" stroke-width="1.5" stroke-linecap="round" opacity="0.8">
      <line x1="218" y1="60" x2="208" y2="50"/>
      <line x1="208" y1="50" x2="202" y2="52"/>
      <line x1="294" y1="60" x2="304" y2="50"/>
      <line x1="304" y1="50" x2="310" y2="52"/>
      <line x1="250" y1="50" x2="248" y2="38"/>
      <line x1="262" y1="50" x2="264" y2="38"/>
    </g>
  </g>

  <!-- Golden particles -->
  <g id="particles">
    <circle cx="145" cy="180" r="4" fill="#f8d860" opacity="0.8"/>
    <circle cx="368" cy="165" r="3.5" fill="#f8d860" opacity="0.7"/>
    <circle cx="155" cy="310" r="3" fill="#f0c840" opacity="0.6"/>
    <circle cx="360" cy="300" r="4" fill="#f0c840" opacity="0.7"/>
    <circle cx="130" cy="250" r="2.5" fill="#ffe060" opacity="0.5"/>
    <circle cx="380" cy="240" r="2.5" fill="#ffe060" opacity="0.5"/>
    <!-- Star sparkles -->
    <g fill="#f8e060">
      <path d="M 140 230 L 142 226 L 144 230 L 148 228 L 144 232 L 148 236 L 144 234 L 142 238 L 140 234 L 136 236 L 140 232 L 136 228 Z" opacity="0.7"/>
      <path transform="scale(0.7) translate(520,300)" d="M 140 230 L 142 226 L 144 230 L 148 228 L 144 232 L 148 236 L 144 234 L 142 238 L 140 234 L 136 236 L 140 232 L 136 228 Z" opacity="0.6"/>
      <path d="M 370 280 L 372 276 L 374 280 L 378 278 L 374 282 L 378 286 L 374 284 L 372 288 L 370 284 L 366 286 L 370 282 L 366 278 Z" opacity="0.7"/>
    </g>
    <!-- Small dots -->
    <circle cx="192" cy="450" r="5" fill="#f0d060" fill-opacity="0.4"/>
    <circle cx="320" cy="452" r="4" fill="#f0d060" fill-opacity="0.4"/>
    <circle cx="256" cy="458" r="6" fill="#f8e060" fill-opacity="0.3"/>
  </g>
</svg>

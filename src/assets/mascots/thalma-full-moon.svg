<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <radialGradient id="tfm-skin" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#ede8f8"/>
      <stop offset="100%" stop-color="#d8d0ec"/>
    </radialGradient>
    <radialGradient id="tfm-hair" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#5058a0"/>
      <stop offset="60%" stop-color="#3a4080"/>
      <stop offset="100%" stop-color="#282860"/>
    </radialGradient>
    <linearGradient id="tfm-outfit" x1="0%" y1="0%" x2="10%" y2="100%">
      <stop offset="0%" stop-color="#3a4488"/>
      <stop offset="100%" stop-color="#282060"/>
    </linearGradient>
    <linearGradient id="tfm-cap" x1="0%" y1="0%" x2="20%" y2="100%">
      <stop offset="0%" stop-color="#4858a8"/>
      <stop offset="100%" stop-color="#303878"/>
    </linearGradient>
    <radialGradient id="tfm-eye" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#b8b8f8"/>
      <stop offset="55%" stop-color="#8888e0"/>
      <stop offset="100%" stop-color="#5858c0"/>
    </radialGradient>
    <!-- Full moon — brightest of all variants -->
    <radialGradient id="tfm-moonCore" cx="45%" cy="42%" r="58%">
      <stop offset="0%" stop-color="#fffef5"/>
      <stop offset="35%" stop-color="#fff8c0"/>
      <stop offset="70%" stop-color="#f8e860"/>
      <stop offset="100%" stop-color="#e8c830"/>
    </radialGradient>
    <radialGradient id="tfm-moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8a0" stop-opacity="0.90"/>
      <stop offset="40%" stop-color="#f8e060" stop-opacity="0.55"/>
      <stop offset="80%" stop-color="#f0d040" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#f0d040" stop-opacity="0"/>
    </radialGradient>
    <!-- Halo ring gradient -->
    <radialGradient id="tfm-halo" cx="50%" cy="50%" r="50%">
      <stop offset="72%" stop-color="#f8e060" stop-opacity="0"/>
      <stop offset="82%" stop-color="#fff8c0" stop-opacity="0.55"/>
      <stop offset="90%" stop-color="#f0d040" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f0d040" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tfm-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a8a040" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#806820" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tfm-bodyGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9890b8" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#7070a0" stop-opacity="0"/>
    </radialGradient>
    <filter id="tfm-blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="tfm-blurMed" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="tfm-soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="tfm-moonGlowFilter" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="tfm-starGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Strongest ambient glow — radiates gold throughout scene -->
  <g id="glow">
    <!-- Broad golden wash behind character -->
    <ellipse cx="256" cy="280" rx="220" ry="200" fill="url(#tfm-glow)" filter="url(#tfm-blur)"/>
    <!-- Body-level warm glow -->
    <ellipse cx="256" cy="350" rx="165" ry="110" fill="url(#tfm-bodyGlow)" filter="url(#tfm-blur)"/>
    <!-- Gold+silver halo ring behind character (large, subtle) -->
    <circle cx="256" cy="260" r="165" fill="url(#tfm-halo)" filter="url(#tfm-blurMed)"/>
  </g>

  <!-- Hair back -->
  <g id="hair-back">
    <ellipse cx="256" cy="200" rx="90" ry="100" fill="url(#tfm-hair)"/>
    <path d="M 177 228 Q 158 320 166 415 Q 170 432 182 432 Q 192 432 194 412 Q 198 335 206 268 Z" fill="#303070"/>
    <path d="M 335 228 Q 354 320 346 415 Q 342 432 330 432 Q 320 432 318 412 Q 314 335 306 268 Z" fill="#303070"/>
  </g>

  <!-- Body — arms slightly raised as if cradling the moon -->
  <g id="body">
    <rect x="237" y="292" width="38" height="22" rx="9" fill="url(#tfm-skin)"/>
    <path d="M 178 312 Q 196 296 256 294 Q 316 296 334 312 L 345 450 Q 298 472 256 474 Q 214 472 167 450 Z" fill="url(#tfm-outfit)"/>
    <!-- Left arm angled in, cradling -->
    <ellipse cx="162" cy="360" rx="23" ry="52" fill="url(#tfm-outfit)" transform="rotate(-15,162,360)"/>
    <!-- Right arm angled in -->
    <ellipse cx="350" cy="360" rx="23" ry="52" fill="url(#tfm-outfit)" transform="rotate(15,350,360)"/>
    <!-- Left hand -->
    <ellipse cx="148" cy="315" rx="18" ry="14" fill="url(#tfm-skin)"/>
    <!-- Right hand -->
    <ellipse cx="364" cy="315" rx="18" ry="14" fill="url(#tfm-skin)"/>
  </g>

  <!-- Outfit detail -->
  <g id="outfit">
    <g fill="#9090c8" opacity="0.42">
      <circle cx="220" cy="360" r="2.5"/>
      <circle cx="292" cy="380" r="2"/>
      <circle cx="256" cy="425" r="3"/>
      <circle cx="232" cy="412" r="2"/>
      <circle cx="280" cy="358" r="2"/>
    </g>
    <path d="M 180 310 Q 256 303 332 310 L 330 322 Q 256 314 182 322 Z" fill="#4a50a0"/>
    <path d="M 170 447 Q 256 468 342 447 L 345 458 Q 256 480 167 458 Z" fill="#4a50a0"/>
    <!-- Extra golden shimmer on outfit from moon light -->
    <path d="M 225 340 Q 256 332 287 340 Q 256 348 225 340 Z" fill="#f8e060" fill-opacity="0.10"/>
  </g>

  <!-- Face — wide curious eyes, most expressive -->
  <g id="face">
    <ellipse cx="256" cy="200" rx="86" ry="91" fill="url(#tfm-skin)"/>
    <!-- Warm moon-glow tint on face -->
    <ellipse cx="256" cy="200" rx="86" ry="91" fill="#f8e060" fill-opacity="0.05"/>
    <ellipse cx="172" cy="210" rx="13" ry="17" fill="url(#tfm-skin)"/>
    <ellipse cx="340" cy="210" rx="13" ry="17" fill="url(#tfm-skin)"/>
    <ellipse cx="172" cy="210" rx="7" ry="10" fill="#c8c0e0"/>
    <ellipse cx="340" cy="210" rx="7" ry="10" fill="#c8c0e0"/>

    <!-- Wide curious raised brows -->
    <path d="M 203 158 Q 218 151 234 156" stroke="#5060a0" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M 278 156 Q 293 151 309 158" stroke="#5060a0" stroke-width="2.5" stroke-linecap="round" fill="none"/>

    <!-- Widest eyes of all variants -->
    <ellipse cx="220" cy="190" rx="28" ry="27" fill="white"/>
    <ellipse cx="288" cy="190" rx="28" ry="27" fill="white"/>
    <ellipse cx="220" cy="192" rx="22" ry="23" fill="url(#tfm-eye)"/>
    <ellipse cx="288" cy="192" rx="22" ry="23" fill="url(#tfm-eye)"/>
    <ellipse cx="221" cy="193" rx="12" ry="14" fill="#1a1840"/>
    <ellipse cx="289" cy="193" rx="12" ry="14" fill="#1a1840"/>
    <!-- Eye shine — prominent, golden tinted -->
    <ellipse cx="212" cy="181" rx="7" ry="6" fill="white" fill-opacity="0.95"/>
    <ellipse cx="280" cy="181" rx="7" ry="6" fill="white" fill-opacity="0.95"/>
    <ellipse cx="227" cy="197" rx="3.5" ry="3.5" fill="white" fill-opacity="0.65"/>
    <ellipse cx="295" cy="197" rx="3.5" ry="3.5" fill="white" fill-opacity="0.65"/>
    <!-- Tiny gold sparkle in eye -->
    <circle cx="215" cy="185" r="2" fill="#f8e060" fill-opacity="0.5"/>
    <circle cx="283" cy="185" r="2" fill="#f8e060" fill-opacity="0.5"/>
    <!-- Lid lines -->
    <path d="M 192 175 Q 220 161 248 175" stroke="#5060a8" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M 260 175 Q 288 161 316 175" stroke="#5060a8" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- Lower lid -->
    <path d="M 196 211 Q 220 220 244 211" stroke="#9090c8" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <path d="M 264 211 Q 288 220 312 211" stroke="#9090c8" stroke-width="1.5" fill="none" stroke-linecap="round"/>

    <ellipse cx="256" cy="214" rx="4.5" ry="3" fill="#c8b8e0" fill-opacity="0.6"/>
    <!-- Open wonder mouth -->
    <path d="M 236 229 Q 256 243 276 229" stroke="#a898cc" stroke-width="2.3" fill="none" stroke-linecap="round"/>
    <path d="M 242 234 Q 256 244 270 234" fill="#d0b8f0" fill-opacity="0.7" stroke="none"/>
    <!-- Warm blush — lit by moon -->
    <ellipse cx="194" cy="213" rx="23" ry="12" fill="#e0c0f0" fill-opacity="0.30"/>
    <ellipse cx="318" cy="213" rx="23" ry="12" fill="#e0c0f0" fill-opacity="0.30"/>
  </g>

  <!-- Hair front / sleep cap -->
  <g id="hair-front">
    <path d="M 172 178 Q 180 132 215 125 Q 235 120 256 120 Q 277 120 297 125 Q 332 132 340 178" fill="url(#tfm-hair)"/>
    <path d="M 170 175 Q 180 130 256 118 Q 332 130 342 175 Q 310 165 256 162 Q 202 165 170 175 Z" fill="url(#tfm-cap)"/>
    <path d="M 169 175 Q 256 182 343 175 Q 310 188 256 191 Q 202 188 169 175 Z" fill="#3848a0"/>
    <path d="M 230 120 Q 256 55 282 120 Q 268 112 256 110 Q 244 112 230 120 Z" fill="url(#tfm-cap)"/>
    <circle cx="256" cy="56" r="14" fill="#4858a8"/>
    <!-- Cap stars — glowing brighter from moonlight -->
    <g fill="#e8f0ff" filter="url(#tfm-soft)">
      <path d="M 210 148 L 212 143 L 214 148 L 219 146 L 214 151 L 219 156 L 214 153 L 212 158 L 210 153 L 205 156 L 210 151 L 205 146 Z" opacity="0.9"/>
      <path d="M 296 143 L 297 140 L 298 143 L 301 142 L 298 145 L 301 148 L 298 146 L 297 149 L 296 146 L 293 148 L 296 145 L 293 142 Z" opacity="0.85"/>
    </g>
    <!-- Left bang -->
    <path d="M 190 178 Q 200 168 214 174 Q 219 184 212 190 Q 202 185 190 178 Z" fill="#3a4080"/>
    <!-- Hair shine — extra bright from moon glow -->
    <ellipse cx="234" cy="140" rx="22" ry="13" fill="#9098d0" fill-opacity="0.50" transform="rotate(-10,234,140)"/>
  </g>

  <!-- Moon motif — full bright circle, floating at chest level, held/cradled -->
  <g id="motif">
    <!-- Outermost diffuse glow — very large, soft -->
    <circle cx="256" cy="330" r="75" fill="url(#tfm-moonGlow)" filter="url(#tfm-blur)"/>
    <!-- Medium glow ring -->
    <circle cx="256" cy="330" r="52" fill="#fff0a0" fill-opacity="0.22" filter="url(#tfm-blurMed)"/>
    <!-- Moon disc itself -->
    <circle cx="256" cy="330" r="42" fill="url(#tfm-moonCore)" filter="url(#tfm-moonGlowFilter)"/>
    <!-- Subtle crater / texture marks on moon -->
    <circle cx="268" cy="320" r="6" fill="#f0d850" fill-opacity="0.30"/>
    <circle cx="244" cy="340" r="4.5" fill="#f0d850" fill-opacity="0.22"/>
    <circle cx="270" cy="346" r="3.5" fill="#f0d850" fill-opacity="0.18"/>
    <!-- Bright center hotspot -->
    <circle cx="252" cy="325" r="14" fill="white" fill-opacity="0.28"/>
    <!-- Moon outline glow ring -->
    <circle cx="256" cy="330" r="43" fill="none" stroke="#fff8c0" stroke-width="2.5" stroke-opacity="0.60"/>
    <!-- Gold+silver halo ring (thin bright ring just outside disc) -->
    <circle cx="256" cy="330" r="50" fill="none" stroke="#f8e060" stroke-width="1.5" stroke-opacity="0.42" filter="url(#tfm-soft)"/>
    <circle cx="256" cy="330" r="56" fill="none" stroke="#e8d0f8" stroke-width="1" stroke-opacity="0.30" filter="url(#tfm-soft)"/>
    <!-- Small stars orbiting the moon -->
    <path d="M 196 316 L 197.5 311.5 L 199 316 L 203.5 314.5 L 199 318.5 L 203.5 322.5 L 199 321 L 197.5 325.5 L 196 321 L 191.5 322.5 L 196 318.5 L 191.5 314.5 Z" fill="#fff8c0" opacity="0.88" filter="url(#tfm-soft)"/>
    <path d="M 316 318 L 317.2 314.5 L 318.4 318 L 322 316.8 L 318.4 320.2 L 322 323.6 L 318.4 322.4 L 317.2 325.9 L 316 322.4 L 312.4 323.6 L 316 320.2 L 312.4 316.8 Z" fill="#fff8c0" opacity="0.82" filter="url(#tfm-soft)"/>
  </g>

  <!-- Particles — stars and wisps, most abundant -->
  <g id="particles">
    <!-- Bottom cloud wisps -->
    <ellipse cx="172" cy="438" rx="55" ry="25" fill="#3848a0" fill-opacity="0.5" filter="url(#tfm-soft)"/>
    <ellipse cx="172" cy="428" rx="40" ry="22" fill="#3a4490" fill-opacity="0.6"/>
    <ellipse cx="338" cy="442" rx="50" ry="23" fill="#3848a0" fill-opacity="0.5" filter="url(#tfm-soft)"/>
    <ellipse cx="338" cy="432" rx="38" ry="20" fill="#3a4490" fill-opacity="0.6"/>
    <!-- Abundant scattered stars, golden-tinted -->
    <g fill="#f0e8b0" opacity="0.78">
      <circle cx="136" cy="196" r="2.5"/>
      <circle cx="376" cy="192" r="2"/>
      <circle cx="126" cy="306" r="2"/>
      <circle cx="386" cy="286" r="2.5"/>
      <circle cx="144" cy="376" r="2"/>
      <circle cx="370" cy="371" r="2.5"/>
      <circle cx="192" cy="476" r="3" fill-opacity="0.5"/>
      <circle cx="320" cy="473" r="2.5" fill-opacity="0.5"/>
      <circle cx="110" cy="240" r="2"/>
      <circle cx="402" cy="235" r="2"/>
      <circle cx="118" cy="340" r="1.5"/>
      <circle cx="395" cy="330" r="1.5"/>
    </g>
    <!-- Brightest sparkle stars near moon disc -->
    <g fill="#fff8a0" filter="url(#tfm-starGlow)" opacity="0.85">
      <circle cx="206" cy="300" r="2.5"/>
      <circle cx="308" cy="296" r="2"/>
      <circle cx="200" cy="358" r="2"/>
      <circle cx="312" cy="354" r="2.5"/>
    </g>
  </g>
</svg>

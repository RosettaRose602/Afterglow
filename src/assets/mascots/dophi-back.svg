<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <radialGradient id="db-skinGrad" cx="50%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#e8a878"/>
      <stop offset="60%" stop-color="#d4925c"/>
      <stop offset="100%" stop-color="#c07848"/>
    </radialGradient>
    <radialGradient id="db-hairGrad" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#f4a07a"/>
      <stop offset="55%" stop-color="#e8805a"/>
      <stop offset="100%" stop-color="#c05840"/>
    </radialGradient>
    <linearGradient id="db-hairShine" x1="25%" y1="0%" x2="65%" y2="100%">
      <stop offset="0%" stop-color="#ffd4b8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#f4a07a" stop-opacity="0"/>
    </linearGradient>
    <!-- Ponytail — main focal gradient, more elaborate -->
    <linearGradient id="db-ponytailGrad" x1="0%" y1="0%" x2="30%" y2="100%">
      <stop offset="0%" stop-color="#f4a07a"/>
      <stop offset="40%" stop-color="#e8805a"/>
      <stop offset="100%" stop-color="#c05840"/>
    </linearGradient>
    <linearGradient id="db-ponytailTip" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e8805a"/>
      <stop offset="100%" stop-color="#a03828"/>
    </linearGradient>
    <linearGradient id="db-ribbonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe280"/>
      <stop offset="50%" stop-color="#ffd966"/>
      <stop offset="100%" stop-color="#e8a820"/>
    </linearGradient>
    <linearGradient id="db-jacketGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f09070"/>
      <stop offset="100%" stop-color="#d86848"/>
    </linearGradient>
    <linearGradient id="db-shortsGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e87050"/>
      <stop offset="100%" stop-color="#c04828"/>
    </linearGradient>
    <linearGradient id="db-legGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e8a878"/>
      <stop offset="100%" stop-color="#c88858"/>
    </linearGradient>
    <radialGradient id="db-ambientGlow" cx="50%" cy="55%" r="50%">
      <stop offset="0%" stop-color="#f08060" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#f08060" stop-opacity="0"/>
    </radialGradient>
    <filter id="db-softBlur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="db-hairGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Ambient glow -->
  <g id="glow">
    <ellipse cx="256" cy="305" rx="148" ry="105" fill="url(#db-ambientGlow)" filter="url(#db-softBlur)"/>
    <!-- Ponytail area highlight glow -->
    <ellipse cx="256" cy="200" rx="80" ry="140" fill="#f08060" fill-opacity="0.1" filter="url(#db-softBlur)"/>
  </g>

  <!-- Hair back — the MAIN FOCUS from back view -->
  <g id="hair-back">
    <!-- Back of head hair base (very full) -->
    <ellipse cx="256" cy="168" rx="105" ry="112" fill="url(#db-hairGrad)" stroke="#c05840" stroke-width="0.8"/>

    <!-- Ponytail — BIG and dramatic, flowing upward and outward -->
    <!-- Wide base of ponytail -->
    <path d="M 220 118 Q 240 108 256 106 Q 272 108 292 118 Q 310 130 316 142 Q 320 158 314 170 Q 306 184 290 188 Q 272 192 256 192 Q 240 192 222 188 Q 205 184 198 170 Q 192 158 196 142 Q 200 130 220 118 Z" fill="url(#db-hairGrad)" filter="url(#db-hairGlow)"/>

    <!-- Ponytail main body sweeping up -->
    <path d="M 216 126 Q 220 78 240 42 Q 252 20 256 16 Q 260 20 272 42 Q 292 78 296 126" fill="url(#db-ponytailGrad)" stroke="#c05840" stroke-width="0.5"/>

    <!-- Ponytail left wing -->
    <path d="M 216 126 Q 185 100 158 72 Q 138 50 134 64 Q 130 78 148 96 Q 168 114 192 130 Q 210 138 218 138 Z" fill="url(#db-ponytailGrad)"/>
    <!-- Ponytail right wing -->
    <path d="M 296 126 Q 327 100 354 72 Q 374 50 378 64 Q 382 78 364 96 Q 344 114 318 130 Q 300 138 294 138 Z" fill="url(#db-ponytailGrad)"/>

    <!-- Ponytail left wing extension curl -->
    <path d="M 134 64 Q 118 52 115 66 Q 113 80 132 90 Q 145 96 154 88 Q 158 78 148 68 Q 138 60 134 64 Z" fill="url(#db-ponytailTip)" stroke="#c05840" stroke-width="0.8"/>
    <!-- Ponytail right wing extension curl -->
    <path d="M 378 64 Q 394 52 397 66 Q 399 80 380 90 Q 367 96 358 88 Q 354 78 364 68 Q 374 60 378 64 Z" fill="url(#db-ponytailTip)" stroke="#c05840" stroke-width="0.8"/>

    <!-- Ponytail tip at top -->
    <path d="M 245 18 Q 248 5 256 2 Q 264 5 267 18 Q 263 14 256 12 Q 249 14 245 18 Z" fill="url(#db-ponytailTip)"/>

    <!-- Hair strand detail lines - ponytail left -->
    <path d="M 214 128 Q 178 104 148 74" stroke="#f4a07a" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M 212 138 Q 180 118 155 92" stroke="#c05840" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.5"/>
    <path d="M 215 148 Q 192 134 172 116" stroke="#f4a07a" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.45"/>
    <!-- Hair strand detail lines - ponytail right -->
    <path d="M 298 128 Q 334 104 364 74" stroke="#f4a07a" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M 300 138 Q 332 118 357 92" stroke="#c05840" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.5"/>
    <path d="M 297 148 Q 320 134 340 116" stroke="#f4a07a" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.45"/>
    <!-- Center strand up -->
    <path d="M 250 108 Q 252 60 256 18" stroke="#f4a07a" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.55"/>
    <path d="M 256 108 Q 258 60 256 18" stroke="#c05840" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.45"/>
    <path d="M 262 108 Q 260 60 256 18" stroke="#f4a07a" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.4"/>
  </g>

  <!-- Body (back view) -->
  <g id="body">
    <!-- Neck -->
    <rect x="240" y="268" width="32" height="30" rx="10" fill="url(#db-skinGrad)" stroke="#a06840" stroke-width="0.5"/>
    <!-- Torso back -->
    <path d="M 186 294 Q 210 278 256 276 Q 302 278 326 294 L 332 422 Q 298 448 256 450 Q 214 448 180 422 Z" fill="url(#db-jacketGrad)" stroke="#c06040" stroke-width="1"/>
    <!-- Arm left -->
    <path d="M 186 300 Q 164 315 150 348 Q 142 370 147 392 Q 158 396 170 387 Q 172 365 182 344 Q 193 320 200 304 Z" fill="url(#db-jacketGrad)" stroke="#c06040" stroke-width="0.8"/>
    <!-- Arm right -->
    <path d="M 326 300 Q 348 315 362 348 Q 370 370 365 392 Q 354 396 342 387 Q 340 365 330 344 Q 317 320 312 304 Z" fill="url(#db-jacketGrad)" stroke="#c06040" stroke-width="0.8"/>
    <!-- Hands -->
    <ellipse cx="158" cy="394" rx="18" ry="15" fill="url(#db-skinGrad)" stroke="#a06840" stroke-width="0.8"/>
    <ellipse cx="354" cy="394" rx="18" ry="15" fill="url(#db-skinGrad)" stroke="#a06840" stroke-width="0.8"/>
    <!-- Legs -->
    <rect x="210" y="420" width="44" height="72" rx="13" fill="url(#db-legGrad)" stroke="#a07848" stroke-width="0.8"/>
    <rect x="258" y="420" width="44" height="72" rx="13" fill="url(#db-legGrad)" stroke="#a07848" stroke-width="0.8"/>
    <!-- Shoes (back view) -->
    <ellipse cx="232" cy="496" rx="30" ry="13" fill="#d86848" stroke="#a04030" stroke-width="1"/>
    <ellipse cx="280" cy="496" rx="30" ry="13" fill="#d86848" stroke="#a04030" stroke-width="1"/>
    <ellipse cx="248" cy="494" rx="10" ry="5" fill="#ffd966" fill-opacity="0.7"/>
    <ellipse cx="296" cy="494" rx="10" ry="5" fill="#ffd966" fill-opacity="0.7"/>
  </g>

  <!-- Outfit details (back view) -->
  <g id="outfit">
    <!-- Back jacket gold stripes -->
    <path d="M 190 298 Q 170 344 166 394 L 178 396 Q 184 346 202 300 Z" fill="#ffd966" fill-opacity="0.68"/>
    <path d="M 322 298 Q 342 344 346 394 L 334 396 Q 328 346 310 300 Z" fill="#ffd966" fill-opacity="0.68"/>
    <!-- Shorts back -->
    <path d="M 193 402 Q 218 418 256 420 Q 294 418 319 402 L 317 432 Q 294 448 256 450 Q 218 448 195 432 Z" fill="url(#db-shortsGrad)" stroke="#a03828" stroke-width="0.8"/>
    <!-- Back collar line -->
    <path d="M 222 285 Q 256 280 290 285 L 288 295 Q 256 290 224 295 Z" fill="#e06040" stroke="#c04828" stroke-width="0.8"/>
    <!-- Back seam line -->
    <line x1="256" y1="288" x2="256" y2="408" stroke="#c06040" stroke-width="1.5" stroke-dasharray="5,4" stroke-linecap="round" opacity="0.5"/>
    <!-- Jacket sleeve cuffs -->
    <path d="M 148 382 Q 170 386 173 394 L 164 398 Q 158 392 144 388 Z" fill="#e06040"/>
    <path d="M 364 382 Q 342 386 339 394 L 348 398 Q 354 392 368 388 Z" fill="#e06040"/>
  </g>

  <!-- Face (none — back view, just back of head) -->
  <g id="face">
    <!-- No face elements — back view -->
    <!-- Slight ear hint from back -->
    <path d="M 162 182 Q 156 170 160 158 Q 166 152 172 160 Q 174 172 170 182 Z" fill="url(#db-skinGrad)" fill-opacity="0.5"/>
    <path d="M 350 182 Q 356 170 352 158 Q 346 152 340 160 Q 338 172 342 182 Z" fill="url(#db-skinGrad)" fill-opacity="0.5"/>
  </g>

  <!-- Hair front (back view — shows crown framing) -->
  <g id="hair-front">
    <!-- Crown hair around edges (back view shows hair framing the back head) -->
    <path d="M 162 150 Q 172 102 215 92 Q 236 88 256 88 Q 276 88 297 92 Q 340 102 350 150" fill="url(#db-hairGrad)" stroke="#c05840" stroke-width="0.5"/>
    <!-- Hair left side tufts visible around the head -->
    <path d="M 165 162 Q 158 138 166 120 Q 172 108 180 114 Q 178 130 178 150 Z" fill="#c05840" fill-opacity="0.7"/>
    <path d="M 347 162 Q 354 138 346 120 Q 340 108 332 114 Q 334 130 334 150 Z" fill="#c05840" fill-opacity="0.7"/>
    <!-- Hair shine on back of head -->
    <ellipse cx="248" cy="125" rx="32" ry="18" fill="url(#db-hairShine)" transform="rotate(-5,248,125)"/>
    <!-- Gold ribbon/bow prominent at ponytail base -->
    <ellipse cx="256" cy="140" rx="22" ry="15" fill="url(#db-ribbonGrad)" stroke="#c89020" stroke-width="2"/>
    <!-- Big ribbon bow left loop -->
    <path d="M 236 135 Q 218 118 222 136 Q 226 154 242 146 Q 246 140 236 135 Z" fill="url(#db-ribbonGrad)" stroke="#c89020" stroke-width="1.5"/>
    <!-- Big ribbon bow right loop -->
    <path d="M 276 135 Q 294 118 290 136 Q 286 154 270 146 Q 266 140 276 135 Z" fill="url(#db-ribbonGrad)" stroke="#c89020" stroke-width="1.5"/>
    <!-- Ribbon center knot -->
    <ellipse cx="256" cy="140" rx="8" ry="7" fill="#ffe280" stroke="#c89020" stroke-width="1.5"/>
    <!-- Ribbon tail ends -->
    <path d="M 248 152 Q 244 164 248 172" stroke="#ffd966" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.8"/>
    <path d="M 264 152 Q 268 164 264 172" stroke="#ffd966" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- Back wing motif on jacket -->
  <g id="motif">
    <!-- Large back wing motif on jacket center -->
    <path d="M 256 310 Q 232 294 224 278 Q 220 266 228 260 Q 238 256 248 264 Q 254 270 256 278 Q 258 270 264 264 Q 274 256 284 260 Q 292 266 288 278 Q 280 294 256 310 Z" fill="#ffd966" fill-opacity="0.72" stroke="#e8a820" stroke-width="1.5"/>
    <!-- Wing feather lines left -->
    <path d="M 256 278 Q 242 272 228 270" stroke="#e8a820" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M 256 285 Q 240 280 226 280" stroke="#e8a820" stroke-width="1.2" fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M 256 293 Q 241 290 230 292" stroke="#e8a820" stroke-width="1" fill="none" stroke-linecap="round" opacity="0.5"/>
    <!-- Wing feather lines right -->
    <path d="M 256 278 Q 270 272 284 270" stroke="#e8a820" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M 256 285 Q 272 280 286 280" stroke="#e8a820" stroke-width="1.2" fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M 256 293 Q 271 290 282 292" stroke="#e8a820" stroke-width="1" fill="none" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- Particles -->
  <g id="particles">
    <circle cx="130" cy="230" r="3" fill="#ffd966" opacity="0.55"/>
    <circle cx="382" cy="215" r="3" fill="#ffd966" opacity="0.55"/>
    <circle cx="118" cy="318" r="2.5" fill="#f08060" opacity="0.45"/>
    <circle cx="394" cy="308" r="2.5" fill="#f08060" opacity="0.45"/>
    <!-- Sparkle near ponytail tip -->
    <path d="M 136 68 L 138 62 L 140 68 L 146 66 L 140 70 L 146 74 L 140 72 L 138 78 L 136 72 L 130 74 L 136 70 L 130 66 Z" fill="#ffd966" opacity="0.6"/>
    <path d="M 368 68 L 370 62 L 372 68 L 378 66 L 372 70 L 378 74 L 372 72 L 370 78 L 368 72 L 362 74 L 368 70 L 362 66 Z" fill="#ffd966" opacity="0.6"/>
    <!-- Sparkle at ponytail center top -->
    <circle cx="256" cy="18" r="3.5" fill="#ffd966" opacity="0.7"/>
    <circle cx="238" cy="38" r="2.5" fill="#f4a07a" opacity="0.55"/>
    <circle cx="274" cy="38" r="2.5" fill="#f4a07a" opacity="0.55"/>
  </g>
</svg>

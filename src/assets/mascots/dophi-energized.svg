<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <radialGradient id="den-skin" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#f5c9a0"/>
      <stop offset="60%" stop-color="#e8aa78"/>
      <stop offset="100%" stop-color="#d4925c"/>
    </radialGradient>
    <radialGradient id="den-hair" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#f89080"/>
      <stop offset="50%" stop-color="#e06050"/>
      <stop offset="100%" stop-color="#c04030"/>
    </radialGradient>
    <linearGradient id="den-outfit" x1="0%" y1="0%" x2="30%" y2="100%">
      <stop offset="0%" stop-color="#f87858"/>
      <stop offset="100%" stop-color="#d85030"/>
    </linearGradient>
    <linearGradient id="den-gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8d040"/>
      <stop offset="100%" stop-color="#e0a820"/>
    </linearGradient>
    <radialGradient id="den-eye" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#e08050"/>
      <stop offset="60%" stop-color="#b05830"/>
      <stop offset="100%" stop-color="#803010"/>
    </radialGradient>
    <radialGradient id="den-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f88060" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#f88060" stop-opacity="0"/>
    </radialGradient>
    <!-- Trail gradient -->
    <linearGradient id="den-trail" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8d040" stop-opacity="0"/>
      <stop offset="60%" stop-color="#f88060" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#f86040" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="den-bigBlur" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="den-gf" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="den-soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Max energy glow -->
  <g id="glow">
    <ellipse cx="280" cy="280" rx="180" ry="130" fill="url(#den-glow)" filter="url(#den-bigBlur)"/>
    <!-- Speed rings -->
    <ellipse cx="256" cy="280" rx="170" ry="70" fill="none" stroke="#f88060" stroke-width="2" stroke-opacity="0.2"/>
    <ellipse cx="256" cy="280" rx="195" ry="85" fill="none" stroke="#f8d040" stroke-width="1.5" stroke-opacity="0.12"/>
  </g>

  <!-- Motion trails (behind character) -->
  <g id="hair-back" opacity="0.85">
    <!-- Speed trails (left side, like motion blur) -->
    <path d="M 80 200 Q 140 190 195 200" stroke="url(#den-trail)" stroke-width="18" fill="none" stroke-linecap="round" opacity="0.5"/>
    <path d="M 65 230 Q 130 220 190 230" stroke="url(#den-trail)" stroke-width="14" fill="none" stroke-linecap="round" opacity="0.45"/>
    <path d="M 75 265 Q 135 255 192 265" stroke="url(#den-trail)" stroke-width="10" fill="none" stroke-linecap="round" opacity="0.4"/>
    <path d="M 90 300 Q 145 290 193 300" stroke="url(#den-trail)" stroke-width="8" fill="none" stroke-linecap="round" opacity="0.35"/>
    <!-- Ponytail trailing back and up (high energy) -->
    <path d="M 295 148 Q 340 110 395 85 Q 430 68 455 75 Q 440 90 420 100 Q 390 115 360 130 Q 330 148 310 158 Z" fill="#e06050"/>
    <path d="M 302 145 Q 348 108 400 84 Q 435 67 458 74 Q 443 89 423 99 Q 393 114 363 129 Q 332 147 315 156 Z" fill="#f07060" opacity="0.7"/>
    <!-- Gold ribbon on ponytail -->
    <ellipse cx="302" cy="150" rx="14" ry="10" fill="url(#den-gold)" transform="rotate(-30,302,150)"/>
    <!-- Ponytail shine -->
    <path d="M 318 148 Q 352 118 388 92" stroke="#f8a898" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Body (running pose, leaning forward) -->
  <g id="body">
    <!-- Neck -->
    <rect x="244" y="240" width="32" height="22" rx="8" fill="url(#den-skin)" transform="rotate(-5,260,251)"/>
    <!-- Torso (leaning) -->
    <path d="M 200 262 Q 220 248 282 246 Q 325 248 340 262 L 345 360 Q 305 378 260 380 Q 218 378 195 360 Z" fill="url(#den-outfit)" transform="rotate(-5,270,313)"/>
    <!-- Left arm back (pumping) -->
    <ellipse cx="185" cy="310" rx="20" ry="48" fill="url(#den-outfit)" transform="rotate(25,185,310)"/>
    <!-- Right arm forward -->
    <ellipse cx="348" cy="290" rx="20" ry="48" fill="url(#den-outfit)" transform="rotate(-35,348,290)"/>
    <!-- Left hand -->
    <ellipse cx="170" cy="352" rx="16" ry="13" fill="url(#den-skin)" transform="rotate(20,170,352)"/>
    <!-- Right hand -->
    <ellipse cx="368" cy="260" rx="16" ry="13" fill="url(#den-skin)" transform="rotate(-30,368,260)"/>
    <!-- Left leg back -->
    <path d="M 218 375 Q 208 420 212 458 Q 215 470 225 468 Q 234 464 232 452 Q 228 415 238 380 Z" fill="#d85030"/>
    <!-- Right leg forward/up -->
    <path d="M 278 372 Q 298 400 310 428 Q 316 444 308 450 Q 298 454 292 442 Q 280 416 268 388 Z" fill="#d85030"/>
    <!-- Shoes -->
    <ellipse cx="218" cy="462" rx="22" ry="10" fill="#3a1810" transform="rotate(-10,218,462)"/>
    <ellipse cx="300" cy="448" rx="22" ry="10" fill="#3a1810" transform="rotate(20,300,448)"/>
    <!-- Shoe accent stripes -->
    <path d="M 208 458 Q 218 453 228 458" stroke="url(#den-gold)" stroke-width="2" fill="none"/>
    <path d="M 291 444 Q 301 439 311 444" stroke="url(#den-gold)" stroke-width="2" fill="none"/>
  </g>

  <!-- Outfit detail -->
  <g id="outfit">
    <!-- Athletic jacket stripes -->
    <path d="M 205 270 L 202 355 Q 206 360 210 356 L 214 272 Z" fill="url(#den-gold)" opacity="0.8"/>
    <path d="M 338 270 L 341 355 Q 337 360 333 356 L 330 272 Z" fill="url(#den-gold)" opacity="0.8"/>
    <!-- Center logo circle -->
    <circle cx="262" cy="308" r="14" fill="none" stroke="url(#den-gold)" stroke-width="2" transform="rotate(-5,262,308)"/>
    <path d="M 258 305 L 260 300 L 267 308 L 260 315 L 258 310 Z" fill="url(#den-gold)" transform="rotate(-5,262,308)"/>
    <!-- Number on back hint -->
    <circle cx="262" cy="330" r="8" fill="#c04030" opacity="0.5"/>
  </g>

  <!-- Wings / feather energy trails -->
  <g id="motif" filter="url(#den-soft)">
    <!-- Energy wings spreading out (golden) -->
    <!-- Left wing -->
    <path d="M 210 280 Q 168 248 145 218 Q 158 235 175 258 Q 188 275 205 288 Z" fill="#f8d040" opacity="0.75"/>
    <path d="M 208 292 Q 158 268 128 248 Q 145 262 168 280 Q 188 294 204 302 Z" fill="#f0c030" opacity="0.65"/>
    <path d="M 207 305 Q 155 290 122 278 Q 142 288 165 300 Q 188 310 205 318 Z" fill="#e8b020" opacity="0.55"/>
    <!-- Right wing hint -->
    <path d="M 338 280 Q 375 252 398 225 Q 386 242 370 262 Q 355 277 342 289 Z" fill="#f8d040" opacity="0.6"/>
    <!-- Glow on wings -->
    <path d="M 162 228 Q 175 245 190 262" stroke="#fff060" stroke-width="2" fill="none" opacity="0.5"/>
  </g>

  <!-- Face (excited, big smile, wide eyes) -->
  <g id="face">
    <ellipse cx="262" cy="190" rx="84" ry="88" fill="url(#den-skin)" transform="rotate(-5,262,190)"/>
    <ellipse cx="180" cy="198" rx="12" ry="16" fill="url(#den-skin)" transform="rotate(-5,180,198)"/>
    <ellipse cx="340" cy="186" rx="12" ry="16" fill="url(#den-skin)" transform="rotate(-5,340,186)"/>
    <ellipse cx="180" cy="198" rx="7" ry="10" fill="#e8c0a0" transform="rotate(-5,180,198)"/>
    <ellipse cx="340" cy="186" rx="7" ry="10" fill="#e8c0a0" transform="rotate(-5,340,186)"/>

    <!-- Excited eyebrows (high arch) -->
    <path d="M 214 148 Q 228 138 242 142" stroke="#8a3820" stroke-width="3" stroke-linecap="round" fill="none" transform="rotate(-5,228,145)"/>
    <path d="M 278 140 Q 292 130 306 134" stroke="#8a3820" stroke-width="3" stroke-linecap="round" fill="none" transform="rotate(-5,292,132)"/>

    <!-- Wide excited eyes -->
    <ellipse cx="228" cy="176" rx="28" ry="26" fill="white" transform="rotate(-5,228,176)"/>
    <ellipse cx="294" cy="170" rx="28" ry="26" fill="white" transform="rotate(-5,294,170)"/>
    <ellipse cx="228" cy="177" rx="22" ry="23" fill="url(#den-eye)" transform="rotate(-5,228,177)"/>
    <ellipse cx="294" cy="171" rx="22" ry="23" fill="url(#den-eye)" transform="rotate(-5,294,171)"/>
    <ellipse cx="229" cy="179" rx="12" ry="13" fill="#1e0808" transform="rotate(-5,229,179)"/>
    <ellipse cx="295" cy="173" rx="12" ry="13" fill="#1e0808" transform="rotate(-5,295,173)"/>
    <!-- Multiple sparkle highlights (high energy) -->
    <ellipse cx="219" cy="168" rx="8" ry="7" fill="white" fill-opacity="0.95" transform="rotate(-5,219,168)"/>
    <ellipse cx="285" cy="162" rx="8" ry="7" fill="white" fill-opacity="0.95" transform="rotate(-5,285,162)"/>
    <ellipse cx="234" cy="183" rx="4" ry="3.5" fill="white" fill-opacity="0.7"/>
    <ellipse cx="300" cy="177" rx="4" ry="3.5" fill="white" fill-opacity="0.7"/>
    <path d="M 221 166 L 222 164 L 223 166 L 225 165 L 223 167 L 225 169 L 223 168 L 222 170 L 221 168 L 219 169 L 221 167 L 219 165 Z" fill="white"/>
    <path d="M 287 160 L 288 158 L 289 160 L 291 159 L 289 161 L 291 163 L 289 162 L 288 164 L 287 162 L 285 163 L 287 161 L 285 159 Z" fill="white"/>
    <!-- Eyelids -->
    <path d="M 202 162 Q 228 149 254 162" stroke="#7a3018" stroke-width="3" fill="none" stroke-linecap="round" transform="rotate(-5,228,155)"/>
    <path d="M 268 156 Q 294 143 320 156" stroke="#7a3018" stroke-width="3" fill="none" stroke-linecap="round" transform="rotate(-5,294,149)"/>

    <ellipse cx="262" cy="204" rx="5" ry="3.5" fill="#d8a080" fill-opacity="0.6" transform="rotate(-3,262,204)"/>
    <!-- Big excited smile -->
    <path d="M 236 218 Q 262 238 288 218" stroke="#c06040" stroke-width="3" fill="none" stroke-linecap="round" transform="rotate(-3,262,228)"/>
    <path d="M 242 226 Q 262 244 282 226 Q 278 240 262 244 Q 246 240 242 226 Z" fill="#f8c0a0" transform="rotate(-3,262,235)"/>
    <!-- Open excited mouth hint -->
    <ellipse cx="262" cy="233" rx="14" ry="8" fill="#e88060" fill-opacity="0.4" transform="rotate(-3,262,233)"/>
    <!-- Blush (bright) -->
    <ellipse cx="200" cy="200" rx="23" ry="13" fill="#f89060" fill-opacity="0.45" transform="rotate(-5,200,200)"/>
    <ellipse cx="322" cy="190" rx="23" ry="13" fill="#f89060" fill-opacity="0.45" transform="rotate(-5,322,190)"/>
  </g>

  <!-- Hair front bangs -->
  <g id="hair-front">
    <path d="M 180 168 Q 190 118 226 110 Q 246 104 264 104 Q 282 104 300 110 Q 332 120 340 165" fill="url(#den-hair)" transform="rotate(-5,260,135)"/>
    <!-- Center bang -->
    <path d="M 246 105 Q 258 122 262 144 Q 266 122 278 105 Q 266 99 256 99 Q 246 99 246 105 Z" fill="#e06050" transform="rotate(-5,262,122)"/>
    <!-- Side bangs -->
    <path d="M 194 140 Q 206 128 218 135 Q 226 142 224 156 Q 215 149 206 151 Q 196 147 194 140 Z" fill="#d04040" transform="rotate(-5,210,143)"/>
    <path d="M 334 132 Q 322 120 308 127 Q 300 134 302 148 Q 311 141 320 143 Q 330 139 334 132 Z" fill="#d04040" transform="rotate(-5,316,134)"/>
    <!-- Ponytail base (connects to trailing hair) -->
    <path d="M 284 106 Q 298 118 305 140 Q 300 148 292 145 Q 286 135 282 120 Z" fill="#c04030"/>
    <!-- Scrunchie/ribbon at ponytail base -->
    <ellipse cx="296" cy="144" rx="14" ry="9" fill="url(#den-gold)" transform="rotate(-25,296,144)"/>
    <!-- Hair shine -->
    <ellipse cx="244" cy="120" rx="26" ry="16" fill="#f8b0a0" fill-opacity="0.55" transform="rotate(-15,244,120)"/>
  </g>

  <!-- Energy particles -->
  <g id="particles">
    <!-- Big sparkle stars -->
    <g fill="#f8e060" filter="url(#den-soft)">
      <path d="M 120 195 L 123 187 L 126 195 L 134 192 L 126 199 L 134 206 L 126 203 L 123 211 L 120 203 L 112 206 L 120 199 L 112 192 Z" opacity="0.9"/>
      <path d="M 390 188 L 392 182 L 394 188 L 400 186 L 394 191 L 400 196 L 394 194 L 392 200 L 390 194 L 384 196 L 390 191 L 384 186 Z" opacity="0.85"/>
      <path d="M 108 320 L 110 315 L 112 320 L 117 318 L 112 323 L 117 328 L 112 325 L 110 330 L 108 325 L 103 328 L 108 323 L 103 318 Z" opacity="0.75"/>
      <path d="M 402 315 L 404 310 L 406 315 L 411 313 L 406 318 L 411 323 L 406 320 L 404 325 L 402 320 L 397 323 L 402 318 L 397 313 Z" opacity="0.75"/>
    </g>
    <!-- Speed dot trail -->
    <g fill="#f88060">
      <circle cx="115" cy="245" r="4" opacity="0.7"/>
      <circle cx="102" cy="262" r="3" opacity="0.6"/>
      <circle cx="94" cy="278" r="2.5" opacity="0.5"/>
      <circle cx="112" cy="290" r="3.5" opacity="0.6"/>
    </g>
    <!-- Gold energy dots -->
    <circle cx="135" cy="360" r="4" fill="#f8d040" opacity="0.6"/>
    <circle cx="395" cy="340" r="3.5" fill="#f8d040" opacity="0.55"/>
    <circle cx="120" cy="420" r="3" fill="#f0c030" opacity="0.5"/>
    <!-- Ground energy ring -->
    <ellipse cx="265" cy="470" rx="90" ry="20" fill="none" stroke="#f88060" stroke-width="2.5" stroke-opacity="0.35"/>
    <ellipse cx="265" cy="476" rx="115" ry="24" fill="none" stroke="#f8d040" stroke-width="1.5" stroke-opacity="0.2"/>
    <!-- Exclamation sparks -->
    <g stroke="#f8e060" stroke-width="2" stroke-linecap="round" opacity="0.7">
      <line x1="125" y1="165" x2="130" y2="155"/>
      <line x1="130" y1="155" x2="128" y2="160"/>
      <line x1="392" y1="158" x2="387" y2="148"/>
      <line x1="387" y1="148" x2="389" y2="153"/>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <radialGradient id="twng-skin" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#e8e0f4"/>
      <stop offset="100%" stop-color="#d0c8e8"/>
    </radialGradient>
    <radialGradient id="twng-hair" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#5058a0"/>
      <stop offset="60%" stop-color="#3a4080"/>
      <stop offset="100%" stop-color="#282860"/>
    </radialGradient>
    <linearGradient id="twng-outfit" x1="0%" y1="0%" x2="10%" y2="100%">
      <stop offset="0%" stop-color="#3a4488"/>
      <stop offset="100%" stop-color="#282060"/>
    </linearGradient>
    <linearGradient id="twng-cap" x1="0%" y1="0%" x2="20%" y2="100%">
      <stop offset="0%" stop-color="#4858a8"/>
      <stop offset="100%" stop-color="#303878"/>
    </linearGradient>
    <radialGradient id="twng-eye" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#9898e8"/>
      <stop offset="60%" stop-color="#6868c0"/>
      <stop offset="100%" stop-color="#4040a0"/>
    </radialGradient>
    <!-- Waning gibbous moon — right side lit, cooler gold starting to shift blue -->
    <radialGradient id="twng-moon" cx="62%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#fff4d0"/>
      <stop offset="50%" stop-color="#e8d880"/>
      <stop offset="100%" stop-color="#c8b850"/>
    </radialGradient>
    <!-- Cooling glow — blue-gold mix -->
    <radialGradient id="twng-moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d8d8f8" stop-opacity="0.65"/>
      <stop offset="50%" stop-color="#b0b8e8" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#9090c8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="twng-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6870b8" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#5060a0" stop-opacity="0"/>
    </radialGradient>
    <!-- Soft cloud gradient -->
    <radialGradient id="twng-cloud" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#c8d0f0"/>
      <stop offset="100%" stop-color="#9098c8"/>
    </radialGradient>
    <filter id="twng-blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="twng-soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="twng-moonBlur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="twng-cloudSoft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Clip to moon circle for gibbous mask -->
    <clipPath id="twng-moonClip"><circle cx="256" cy="44" r="28"/></clipPath>
  </defs>

  <!-- Ambient glow — cooler, bluer than full moon -->
  <g id="glow">
    <ellipse cx="256" cy="44" rx="72" ry="72" fill="url(#twng-moonGlow)" filter="url(#twng-blur)"/>
    <ellipse cx="256" cy="345" rx="150" ry="96" fill="url(#twng-glow)" filter="url(#twng-blur)"/>
  </g>

  <!-- Hair back -->
  <g id="hair-back">
    <ellipse cx="256" cy="200" rx="90" ry="100" fill="url(#twng-hair)"/>
    <path d="M 177 228 Q 158 320 166 415 Q 170 432 182 432 Q 192 432 194 412 Q 198 335 206 268 Z" fill="#303070"/>
    <path d="M 335 228 Q 354 320 346 415 Q 342 432 330 432 Q 320 432 318 412 Q 314 335 306 268 Z" fill="#303070"/>
  </g>

  <!-- Body — arms hugging cloud to chest -->
  <g id="body">
    <rect x="237" y="292" width="38" height="22" rx="9" fill="url(#twng-skin)"/>
    <path d="M 178 312 Q 196 296 256 294 Q 316 296 334 312 L 345 450 Q 298 472 256 474 Q 214 472 167 450 Z" fill="url(#twng-outfit)"/>
    <!-- Left arm curved inward hugging -->
    <ellipse cx="162" cy="362" rx="23" ry="52" fill="url(#twng-outfit)" transform="rotate(-14,162,362)"/>
    <!-- Right arm curved inward hugging -->
    <ellipse cx="350" cy="362" rx="23" ry="52" fill="url(#twng-outfit)" transform="rotate(14,350,362)"/>
    <!-- Left hand -->
    <ellipse cx="149" cy="318" rx="18" ry="14" fill="url(#twng-skin)"/>
    <!-- Right hand -->
    <ellipse cx="363" cy="318" rx="18" ry="14" fill="url(#twng-skin)"/>
    <!-- Fluffy cloud hugged to chest — in front of body, behind face -->
    <g filter="url(#twng-cloudSoft)">
      <ellipse cx="256" cy="320" rx="58" ry="28" fill="url(#twng-cloud)" fill-opacity="0.82"/>
      <ellipse cx="224" cy="312" rx="26" ry="22" fill="url(#twng-cloud)" fill-opacity="0.88"/>
      <ellipse cx="256" cy="308" rx="30" ry="22" fill="url(#twng-cloud)" fill-opacity="0.90"/>
      <ellipse cx="288" cy="312" rx="26" ry="22" fill="url(#twng-cloud)" fill-opacity="0.88"/>
      <ellipse cx="210" cy="320" rx="18" ry="16" fill="url(#twng-cloud)" fill-opacity="0.75"/>
      <ellipse cx="302" cy="320" rx="18" ry="16" fill="url(#twng-cloud)" fill-opacity="0.75"/>
    </g>
    <!-- Cloud highlight -->
    <ellipse cx="248" cy="308" rx="18" ry="10" fill="white" fill-opacity="0.28"/>
  </g>

  <!-- Outfit detail -->
  <g id="outfit">
    <g fill="#6878b8" opacity="0.35">
      <circle cx="220" cy="370" r="2.5"/>
      <circle cx="292" cy="388" r="2"/>
      <circle cx="256" cy="430" r="3"/>
      <circle cx="230" cy="418" r="2"/>
      <circle cx="282" cy="365" r="2"/>
    </g>
    <path d="M 180 310 Q 256 303 332 310 L 330 322 Q 256 314 182 322 Z" fill="#4a50a0"/>
    <path d="M 170 447 Q 256 468 342 447 L 345 458 Q 256 480 167 458 Z" fill="#4a50a0"/>
  </g>

  <!-- Face — relaxed, slightly sleepy, soft expression -->
  <g id="face">
    <ellipse cx="256" cy="200" rx="86" ry="91" fill="url(#twng-skin)"/>
    <ellipse cx="172" cy="210" rx="13" ry="17" fill="url(#twng-skin)"/>
    <ellipse cx="340" cy="210" rx="13" ry="17" fill="url(#twng-skin)"/>
    <ellipse cx="172" cy="210" rx="7" ry="10" fill="#c8c0e0"/>
    <ellipse cx="340" cy="210" rx="7" ry="10" fill="#c8c0e0"/>

    <!-- Relaxed, gently lowered brows -->
    <path d="M 208 163 Q 220 158 232 161" stroke="#5060a0" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M 280 161 Q 292 158 304 163" stroke="#5060a0" stroke-width="2.5" stroke-linecap="round" fill="none"/>

    <!-- Eyes half-open, a touch droopy / sleepy -->
    <ellipse cx="220" cy="190" rx="26" ry="22" fill="white"/>
    <ellipse cx="288" cy="190" rx="26" ry="22" fill="white"/>
    <ellipse cx="220" cy="193" rx="20" ry="19" fill="url(#twng-eye)"/>
    <ellipse cx="288" cy="193" rx="20" ry="19" fill="url(#twng-eye)"/>
    <ellipse cx="221" cy="194" rx="10" ry="11" fill="#1a1840"/>
    <ellipse cx="289" cy="194" rx="10" ry="11" fill="#1a1840"/>
    <!-- Eye shine -->
    <ellipse cx="213" cy="183" rx="6" ry="5" fill="white" fill-opacity="0.9"/>
    <ellipse cx="281" cy="183" rx="6" ry="5" fill="white" fill-opacity="0.9"/>
    <!-- Lid lines -->
    <path d="M 196 177 Q 220 165 244 177" stroke="#5060a8" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M 264 177 Q 288 165 312 177" stroke="#5060a8" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- Slightly heavy upper lids — releasing state -->
    <path d="M 198 178 Q 220 168 242 178 Q 230 188 220 190 Q 210 188 198 178 Z" fill="url(#twng-hair)" opacity="0.40"/>
    <path d="M 266 178 Q 288 168 310 178 Q 298 188 288 190 Q 278 188 266 178 Z" fill="url(#twng-hair)" opacity="0.40"/>
    <!-- Lower lid -->
    <path d="M 200 209 Q 220 217 240 209" stroke="#9090c8" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <path d="M 268 209 Q 288 217 308 209" stroke="#9090c8" stroke-width="1.5" fill="none" stroke-linecap="round"/>

    <ellipse cx="256" cy="214" rx="4.5" ry="3" fill="#c8b8e0" fill-opacity="0.6"/>
    <!-- Calm soft smile -->
    <path d="M 241 228 Q 256 237 271 228" stroke="#a898cc" stroke-width="2.1" fill="none" stroke-linecap="round"/>
    <path d="M 246 232 Q 256 239 266 232" fill="#d8c8f0" stroke="none"/>
    <!-- Soft blush -->
    <ellipse cx="198" cy="212" rx="21" ry="11" fill="#b0b8e8" fill-opacity="0.28"/>
    <ellipse cx="314" cy="212" rx="21" ry="11" fill="#b0b8e8" fill-opacity="0.28"/>
  </g>

  <!-- Hair front / sleep cap -->
  <g id="hair-front">
    <path d="M 172 178 Q 180 132 215 125 Q 235 120 256 120 Q 277 120 297 125 Q 332 132 340 178" fill="url(#twng-hair)"/>
    <path d="M 170 175 Q 180 130 256 118 Q 332 130 342 175 Q 310 165 256 162 Q 202 165 170 175 Z" fill="url(#twng-cap)"/>
    <path d="M 169 175 Q 256 182 343 175 Q 310 188 256 191 Q 202 188 169 175 Z" fill="#3848a0"/>
    <path d="M 230 120 Q 256 55 282 120 Q 268 112 256 110 Q 244 112 230 120 Z" fill="url(#twng-cap)"/>
    <circle cx="256" cy="56" r="14" fill="#4858a8"/>
    <!-- Cap stars -->
    <g fill="#c8d8f8" filter="url(#twng-soft)">
      <path d="M 210 148 L 212 143 L 214 148 L 219 146 L 214 151 L 219 156 L 214 153 L 212 158 L 210 153 L 205 156 L 210 151 L 205 146 Z" opacity="0.80"/>
      <path d="M 296 143 L 297 140 L 298 143 L 301 142 L 298 145 L 301 148 L 298 146 L 297 149 L 296 146 L 293 148 L 296 145 L 293 142 Z" opacity="0.70"/>
    </g>
    <!-- Left bang -->
    <path d="M 190 178 Q 200 168 214 174 Q 219 184 212 190 Q 202 185 190 178 Z" fill="#3a4080"/>
    <!-- Hair shine -->
    <ellipse cx="234" cy="140" rx="22" ry="13" fill="#7080c0" fill-opacity="0.40" transform="rotate(-10,234,140)"/>
  </g>

  <!-- Moon motif — waning gibbous (right side lit ~80%, left side dark) -->
  <g id="motif">
    <!-- Full moon base -->
    <circle cx="256" cy="44" r="28" fill="#0e0e1e"/>
    <!-- Lit right portion — clip to moon circle -->
    <ellipse cx="265" cy="44" rx="23" ry="28" fill="url(#twng-moon)" clip-path="url(#twng-moonClip)" filter="url(#twng-moonBlur)"/>
    <!-- Outer glow — cool blue-gold -->
    <circle cx="256" cy="44" r="38" fill="url(#twng-moonGlow)" filter="url(#twng-blur)"/>
    <!-- Subtle surface texture on lit side -->
    <circle cx="272" cy="36" r="4" fill="#e0d070" fill-opacity="0.28" clip-path="url(#twng-moonClip)"/>
    <circle cx="266" cy="52" r="3" fill="#e0d070" fill-opacity="0.20" clip-path="url(#twng-moonClip)"/>
    <!-- Small cooling star beside (left of moon) -->
    <path d="M 216 28 L 217.5 23.5 L 219 28 L 223.5 26.5 L 219 30.5 L 223.5 34.5 L 219 33 L 217.5 37.5 L 216 33 L 211.5 34.5 L 216 30.5 L 211.5 26.5 Z" fill="#c8d8f8" opacity="0.80" filter="url(#twng-soft)"/>
  </g>

  <!-- Particles — cooler toned stars, soft cloud wisps -->
  <g id="particles">
    <!-- Bottom cloud wisps -->
    <ellipse cx="172" cy="438" rx="55" ry="25" fill="#3848a0" fill-opacity="0.5" filter="url(#twng-soft)"/>
    <ellipse cx="172" cy="428" rx="40" ry="22" fill="#3a4490" fill-opacity="0.6"/>
    <ellipse cx="338" cy="442" rx="50" ry="23" fill="#3848a0" fill-opacity="0.5" filter="url(#twng-soft)"/>
    <ellipse cx="338" cy="432" rx="38" ry="20" fill="#3a4490" fill-opacity="0.6"/>
    <!-- Scattered stars — cooler, blue-white -->
    <g fill="#c8d4f8" opacity="0.68">
      <circle cx="138" cy="198" r="2.5"/>
      <circle cx="374" cy="194" r="2"/>
      <circle cx="130" cy="308" r="2"/>
      <circle cx="382" cy="288" r="2.5"/>
      <circle cx="148" cy="378" r="2"/>
      <circle cx="366" cy="373" r="2.5"/>
      <circle cx="194" cy="478" r="3" fill-opacity="0.5"/>
      <circle cx="318" cy="475" r="2.5" fill-opacity="0.5"/>
      <circle cx="112" cy="248" r="1.5"/>
      <circle cx="400" cy="242" r="1.5"/>
    </g>
    <!-- Soft small cloud wisps near hugged cloud -->
    <g fill="#9098c8" opacity="0.35" filter="url(#twng-soft)">
      <ellipse cx="192" cy="295" rx="14" ry="8"/>
      <ellipse cx="320" cy="298" rx="12" ry="7"/>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <radialGradient id="dr-skinGrad" cx="50%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#f5c9a0"/>
      <stop offset="60%" stop-color="#e8aa78"/>
      <stop offset="100%" stop-color="#d4925c"/>
    </radialGradient>
    <radialGradient id="dr-hairGrad" cx="40%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#f4a07a"/>
      <stop offset="55%" stop-color="#e8805a"/>
      <stop offset="100%" stop-color="#c05840"/>
    </radialGradient>
    <linearGradient id="dr-hairShine" x1="25%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#ffd4b8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#f4a07a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="dr-ponytailGrad" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#f4a07a"/>
      <stop offset="55%" stop-color="#e8805a"/>
      <stop offset="100%" stop-color="#c05840"/>
    </linearGradient>
    <linearGradient id="dr-ribbonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe280"/>
      <stop offset="50%" stop-color="#ffd966"/>
      <stop offset="100%" stop-color="#e8a820"/>
    </linearGradient>
    <radialGradient id="dr-eyeIris" cx="35%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#f0a060"/>
      <stop offset="50%" stop-color="#d46030"/>
      <stop offset="100%" stop-color="#8b3010"/>
    </radialGradient>
    <linearGradient id="dr-jacketGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f09070"/>
      <stop offset="100%" stop-color="#d86848"/>
    </linearGradient>
    <linearGradient id="dr-shortsGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e87050"/>
      <stop offset="100%" stop-color="#c04828"/>
    </linearGradient>
    <linearGradient id="dr-legGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e8a878"/>
      <stop offset="100%" stop-color="#c88858"/>
    </linearGradient>
    <!-- Water bottle -->
    <linearGradient id="dr-bottleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a8dff8"/>
      <stop offset="50%" stop-color="#78c8f0"/>
      <stop offset="100%" stop-color="#50aee0"/>
    </linearGradient>
    <!-- Towel -->
    <linearGradient id="dr-towelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffeac0"/>
      <stop offset="100%" stop-color="#f8d090"/>
    </linearGradient>
    <radialGradient id="dr-ambientGlow" cx="50%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#f08060" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#f08060" stop-opacity="0"/>
    </radialGradient>
    <filter id="dr-softBlur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <!-- Ambient glow (soft, relaxed) -->
  <g id="glow">
    <ellipse cx="256" cy="355" rx="175" ry="80" fill="url(#dr-ambientGlow)" filter="url(#dr-softBlur)"/>
    <ellipse cx="256" cy="180" rx="100" ry="88" fill="#f08060" fill-opacity="0.06" filter="url(#dr-softBlur)"/>
    <!-- Ground shadow -->
    <ellipse cx="256" cy="474" rx="130" ry="22" fill="#d4925c" fill-opacity="0.18"/>
  </g>

  <!-- Hair back + ponytail falling loosely to side -->
  <g id="hair-back">
    <!-- Back hair mass -->
    <ellipse cx="256" cy="170" rx="100" ry="108" fill="url(#dr-hairGrad)"/>
    <!-- Ponytail falling loosely to the right side, gentle curve downward -->
    <path d="M 305 130 Q 348 128 380 140 Q 408 152 418 175 Q 426 198 416 220 Q 405 242 386 250 Q 366 258 350 248 Q 332 236 326 214 Q 318 188 322 162 Q 318 144 305 130 Z" fill="url(#dr-ponytailGrad)" stroke="#c05840" stroke-width="0.8"/>
    <!-- Ponytail gentle extension downward -->
    <path d="M 370 246 Q 385 260 382 278 Q 378 294 366 296 Q 352 297 346 284 Q 340 270 348 254 Z" fill="url(#dr-ponytailGrad)"/>
    <!-- Hair strand lines (relaxed, gentle curves) -->
    <path d="M 320 138 Q 362 138 398 158" stroke="#c05840" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.5"/>
    <path d="M 318 155 Q 356 155 390 172" stroke="#f4a07a" stroke-width="1.8" fill="none" stroke-linecap="round" opacity="0.45"/>
    <path d="M 320 172 Q 352 170 378 185" stroke="#c05840" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.4"/>
    <path d="M 326 200 Q 348 204 368 218" stroke="#f4a07a" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.4"/>
    <path d="M 356 248 Q 368 258 374 272" stroke="#c05840" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.4"/>
    <!-- Ponytail tip curl at bottom -->
    <path d="M 365 293 Q 375 304 370 314 Q 362 320 354 312 Q 348 302 356 294 Z" fill="url(#dr-ponytailGrad)" stroke="#c05840" stroke-width="1"/>
  </g>

  <!-- Body (seated/resting pose) -->
  <g id="body">
    <!-- Neck -->
    <rect x="240" y="268" width="32" height="28" rx="9" fill="url(#dr-skinGrad)" stroke="#c07850" stroke-width="0.5"/>
    <!-- Torso (seated, slightly forward lean — relaxed) -->
    <path d="M 190 292 Q 214 278 256 276 Q 298 278 322 292 L 326 390 Q 300 408 256 410 Q 212 408 186 390 Z" fill="url(#dr-jacketGrad)" stroke="#c06040" stroke-width="1"/>
    <!-- Left arm resting on knee, slightly forward -->
    <path d="M 190 298 Q 172 315 164 346 Q 160 366 165 385 Q 175 390 183 382 Q 184 362 192 340 Q 200 318 202 300 Z" fill="url(#dr-jacketGrad)" stroke="#c06040" stroke-width="0.8"/>
    <!-- Right arm (holding water bottle) -->
    <path d="M 322 298 Q 340 310 350 336 Q 356 354 352 372 Q 342 378 334 370 Q 332 350 326 330 Q 318 310 314 300 Z" fill="url(#dr-jacketGrad)" stroke="#c06040" stroke-width="0.8"/>
    <!-- Left hand resting on knee -->
    <ellipse cx="172" cy="387" rx="18" ry="14" fill="url(#dr-skinGrad)" stroke="#c07850" stroke-width="0.8"/>
    <!-- Right hand holding bottle -->
    <ellipse cx="344" cy="374" rx="17" ry="14" fill="url(#dr-skinGrad)" stroke="#c07850" stroke-width="0.8"/>

    <!-- Seated legs (bent, feet forward) -->
    <!-- Left leg bent forward -->
    <path d="M 196 388 Q 194 408 182 426 Q 170 444 162 456 Q 155 466 162 472 Q 172 476 184 466 Q 198 450 212 432 Q 224 416 226 400 Q 218 390 196 388 Z" fill="url(#dr-legGrad)" stroke="#c07850" stroke-width="0.8"/>
    <!-- Right leg bent forward -->
    <path d="M 316 388 Q 318 408 330 426 Q 342 444 350 456 Q 357 466 350 472 Q 340 476 328 466 Q 314 450 300 432 Q 288 416 286 400 Q 294 390 316 388 Z" fill="url(#dr-legGrad)" stroke="#c07850" stroke-width="0.8"/>
    <!-- Lower legs (horizontal, resting on ground) -->
    <path d="M 182 466 Q 200 476 256 480 Q 312 476 330 466" stroke="url(#dr-legGrad)" stroke-width="32" stroke-linecap="round" fill="none"/>
    <!-- Feet/shoes -->
    <ellipse cx="164" cy="470" rx="24" ry="13" fill="#d86848" stroke="#a04030" stroke-width="1"/>
    <ellipse cx="348" cy="470" rx="24" ry="13" fill="#d86848" stroke="#a04030" stroke-width="1"/>
    <ellipse cx="153" cy="468" rx="8" ry="5" fill="#ffd966" fill-opacity="0.7"/>
    <ellipse cx="337" cy="468" rx="8" ry="5" fill="#ffd966" fill-opacity="0.7"/>

    <!-- Ground platform / sitting surface -->
    <ellipse cx="256" cy="476" rx="140" ry="14" fill="#e8a060" fill-opacity="0.22"/>
  </g>

  <!-- Outfit details -->
  <g id="outfit">
    <!-- Gold jacket stripe left -->
    <path d="M 194 298 Q 178 346 172 388 L 184 390 Q 190 348 206 300 Z" fill="#ffd966" fill-opacity="0.7"/>
    <!-- Gold jacket stripe right -->
    <path d="M 318 298 Q 334 346 338 388 L 326 390 Q 320 348 306 300 Z" fill="#ffd966" fill-opacity="0.7"/>
    <!-- Shorts -->
    <path d="M 196 374 Q 222 390 256 392 Q 290 390 316 374 L 314 402 Q 292 414 256 416 Q 220 414 198 402 Z" fill="url(#dr-shortsGrad)" stroke="#a03828" stroke-width="0.8"/>
    <!-- Collar -->
    <path d="M 222 284 Q 256 278 290 284 L 292 296 Q 256 288 220 296 Z" fill="#e06040" stroke="#c04828" stroke-width="0.8"/>
    <!-- Wing motif left chest -->
    <path d="M 210 320 Q 220 310 232 316 Q 224 324 220 330 Q 212 326 210 320 Z" fill="#ffd966" fill-opacity="0.85" stroke="#e8a820" stroke-width="0.8"/>
    <path d="M 207 332 Q 218 321 230 328 Q 222 338 218 344 Q 210 340 207 332 Z" fill="#ffd966" fill-opacity="0.68" stroke="#e8a820" stroke-width="0.8"/>
  </g>

  <!-- Water bottle prop -->
  <g id="motif">
    <!-- Bottle body -->
    <rect x="352" y="320" width="22" height="56" rx="8" fill="url(#dr-bottleGrad)" stroke="#50a8e0" stroke-width="1.2"/>
    <!-- Bottle cap -->
    <rect x="355" y="314" width="16" height="10" rx="4" fill="#e8f8ff" stroke="#50a8e0" stroke-width="1"/>
    <!-- Water level line -->
    <rect x="353" y="340" width="20" height="35" rx="6" fill="#78c8f0" fill-opacity="0.55"/>
    <!-- Bottle label band -->
    <rect x="352" y="335" width="22" height="14" rx="3" fill="#ffd966" fill-opacity="0.5"/>
    <!-- Highlight on bottle -->
    <path d="M 356 322 Q 358 328 356 338" stroke="white" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.7"/>

    <!-- Small towel draped over left knee -->
    <path d="M 145 440 Q 172 432 200 436 Q 216 440 218 452 Q 216 460 200 462 Q 170 466 145 458 Q 130 452 132 445 Q 136 440 145 440 Z" fill="url(#dr-towelGrad)" stroke="#e8b860" stroke-width="1"/>
    <!-- Towel stripe -->
    <path d="M 148 446 Q 175 440 205 444" stroke="#f0c870" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M 148 454 Q 175 450 205 453" stroke="#f0c870" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.5"/>

    <!-- Chest wing emblem -->
    <path d="M 248 340 Q 238 326 242 318 Q 252 313 256 321 Q 260 313 270 318 Q 274 326 264 340 Q 256 333 248 340 Z" fill="#ffd966" fill-opacity="0.8" stroke="#e8a820" stroke-width="1.2"/>
    <line x1="256" y1="319" x2="251" y2="338" stroke="#e8a820" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="256" y1="319" x2="261" y2="338" stroke="#e8a820" stroke-width="1.2" stroke-linecap="round"/>
  </g>

  <!-- Face (relaxed, content expression) -->
  <g id="face">
    <ellipse cx="256" cy="172" rx="92" ry="96" fill="url(#dr-skinGrad)" stroke="#c07850" stroke-width="0.8"/>
    <!-- Ears -->
    <ellipse cx="166" cy="182" rx="14" ry="18" fill="url(#dr-skinGrad)" stroke="#c07850" stroke-width="0.8"/>
    <ellipse cx="346" cy="182" rx="14" ry="18" fill="url(#dr-skinGrad)" stroke="#c07850" stroke-width="0.8"/>
    <ellipse cx="166" cy="182" rx="8" ry="11" fill="#e8906a" fill-opacity="0.45"/>
    <ellipse cx="346" cy="182" rx="8" ry="11" fill="#e8906a" fill-opacity="0.45"/>

    <!-- Eyebrows (relaxed, soft) -->
    <path d="M 206 130 Q 221 122 238 126" stroke="#a04828" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M 274 126 Q 291 122 306 130" stroke="#a04828" stroke-width="3" stroke-linecap="round" fill="none"/>

    <!-- Eyes (slightly more closed/relaxed — half-close) -->
    <ellipse cx="220" cy="162" rx="28" ry="24" fill="white"/>
    <ellipse cx="292" cy="162" rx="28" ry="24" fill="white"/>
    <ellipse cx="220" cy="164" rx="21" ry="21" fill="url(#dr-eyeIris)"/>
    <ellipse cx="292" cy="164" rx="21" ry="21" fill="url(#dr-eyeIris)"/>
    <ellipse cx="221" cy="166" rx="11" ry="12" fill="#2a1008"/>
    <ellipse cx="293" cy="166" rx="11" ry="12" fill="#2a1008"/>
    <!-- Eye shines (smaller, relaxed) -->
    <ellipse cx="212" cy="157" rx="7" ry="6" fill="white" fill-opacity="0.92"/>
    <ellipse cx="284" cy="157" rx="7" ry="6" fill="white" fill-opacity="0.92"/>
    <!-- Relaxed eyelid (slightly lowered) -->
    <path d="M 194 152 Q 220 143 246 152" stroke="#7a2a10" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M 266 152 Q 292 143 318 152" stroke="#7a2a10" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- Soft lower lid -->
    <path d="M 198 175 Q 220 184 242 175" stroke="#c07050" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <path d="M 270 175 Q 292 184 314 175" stroke="#c07050" stroke-width="1.5" fill="none" stroke-linecap="round"/>

    <!-- Nose -->
    <ellipse cx="256" cy="190" rx="5.5" ry="4" fill="#c07850" fill-opacity="0.5"/>

    <!-- Content gentle smile -->
    <path d="M 236 210 Q 256 222 276 210" stroke="#a05030" stroke-width="2.8" fill="none" stroke-linecap="round"/>
    <path d="M 241 212 Q 256 220 271 212 Q 256 222 241 212 Z" fill="white" fill-opacity="0.6"/>

    <!-- Bigger blush (resting/warm) -->
    <ellipse cx="192" cy="186" rx="26" ry="14" fill="#f08060" fill-opacity="0.32"/>
    <ellipse cx="320" cy="186" rx="26" ry="14" fill="#f08060" fill-opacity="0.32"/>

    <!-- Small sweat drop (resting after exercise) -->
    <path d="M 340 145 Q 344 138 348 145 Q 348 152 344 153 Q 340 152 340 145 Z" fill="#a8d8f8" fill-opacity="0.75" stroke="#80c0e8" stroke-width="0.8"/>
  </g>

  <!-- Hair front / bangs -->
  <g id="hair-front">
    <path d="M 166 152 Q 174 100 216 90 Q 236 86 256 86 Q 276 86 296 90 Q 338 100 346 152" fill="url(#dr-hairGrad)" stroke="#c05840" stroke-width="0.5"/>
    <path d="M 238 88 Q 250 108 256 132 Q 262 108 274 88 Q 265 84 256 84 Q 247 84 238 88 Z" fill="#c05840"/>
    <path d="M 183 124 Q 196 108 215 116 Q 226 123 225 142 Q 214 136 200 138 Q 188 134 183 124 Z" fill="#b04838"/>
    <path d="M 329 124 Q 316 108 297 116 Q 286 123 287 142 Q 298 136 312 138 Q 324 134 329 124 Z" fill="#b04838"/>
    <ellipse cx="237" cy="110" rx="29" ry="15" fill="url(#dr-hairShine)" transform="rotate(-10,237,110)"/>
    <!-- Ribbon (looser, casual) -->
    <ellipse cx="318" cy="138" rx="15" ry="10" fill="url(#dr-ribbonGrad)" stroke="#c89020" stroke-width="1.5"/>
    <path d="M 304 134 Q 294 125 298 138 Q 302 152 314 144 Z" fill="url(#dr-ribbonGrad)" stroke="#c89020" stroke-width="1"/>
    <path d="M 332 134 Q 342 125 338 138 Q 334 152 322 144 Z" fill="url(#dr-ribbonGrad)" stroke="#c89020" stroke-width="1"/>
    <ellipse cx="318" cy="138" rx="5" ry="5" fill="#ffe280" stroke="#c89020" stroke-width="1"/>
  </g>

  <!-- Particles (calm, sparse) -->
  <g id="particles">
    <circle cx="136" cy="236" r="3" fill="#ffd966" opacity="0.5"/>
    <circle cx="378" cy="224" r="2.5" fill="#ffd966" opacity="0.48"/>
    <circle cx="126" cy="325" r="2" fill="#f08060" opacity="0.4"/>
    <circle cx="388" cy="318" r="2.5" fill="#f08060" opacity="0.42"/>
    <!-- Tiny rest sparkle -->
    <path d="M 140 276 L 142 271 L 144 276 L 149 274 L 144 278 L 149 282 L 144 280 L 142 285 L 140 280 L 135 282 L 140 278 L 135 274 Z" fill="#ffd966" opacity="0.48"/>
  </g>
</svg>
